<style>
  :root{
    --black:#000; --night:#101010; --ink:#181818; --dim:#707070; --silver:#AFAFAF;
    --line:#e9e7e4; --line2:#dedbd6; --bg:#f4f2ef; --card:#fff;
    --red:#D93C1D; --tomato:#FB5434; --ember:#ff7a45; --sug:#3f66c8; --curr:#2f9e6b;
    --floor:#9aa0a6; --g56:#D93C1D; --g78:#a62f12; --hs:#2a2a2e;
    --shadow:0 1px 2px rgba(16,16,16,.04),0 8px 30px rgba(16,16,16,.06);
    --shadow-lift:0 2px 6px rgba(16,16,16,.06),0 18px 44px rgba(217,60,29,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 "Open Sans","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  h1,h2,h3,.mark,.code,.kbd{font-family:Montserrat,"Helvetica Neue",Arial,sans-serif}
  ::selection{background:#ffd9cd}
  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- top bar ---------- */
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 20px;flex:0 0 auto}
  .topbar .row{display:flex;align-items:center;gap:18px;height:60px}
  .brand{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .mark{font-weight:900;font-size:21px;letter-spacing:.02em;color:var(--black);display:flex;align-items:center;line-height:1}
  .mark img{width:.92em;height:.92em;margin:0 .01em;transform:translateY(.04em)}
  .mark .prep{color:var(--dim);margin-left:.28em;font-weight:800}
  .brand .sub{font-family:Montserrat;font-weight:700;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);padding-left:1px}
  .searchwrap{position:relative;flex:1;max-width:600px;margin:0 auto}
  .searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4}
  #q{width:100%;padding:11px 78px 11px 40px;border:1.5px solid var(--line2);border-radius:12px;
    font:500 14.5px "Open Sans",Arial;background:#faf9f8;transition:border-color .15s,background .15s,box-shadow .15s}
  #q:focus{outline:none;border-color:var(--tomato);background:#fff;box-shadow:0 0 0 4px rgba(251,84,52,.10)}
  .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--silver);
    border:1px solid var(--line2);border-radius:6px;padding:2px 7px;background:#fff;pointer-events:none}
  .stat{font-size:12px;color:var(--silver);white-space:nowrap;font-variant-numeric:tabular-nums}
  .stat b{color:var(--dim);font-weight:700}
  .controls{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:#fff;color:var(--dim);font:700 12px Montserrat,Arial;padding:6px 12px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button.on{background:var(--night);color:#fff}
  .seg button:disabled{color:var(--silver);cursor:not-allowed;background:#f6f6f4}
  .seg.subj{opacity:.9}
  .chalbtn{border:1px solid var(--line2);border-radius:9px;background:#f6f6f4;color:var(--silver);font:700 12px Montserrat,Arial;padding:6px 12px;cursor:not-allowed}
  .hide{display:none!important}
  #map{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--bg)}
  #mapsvg{width:100%;height:100%;cursor:grab;display:block}
  #mapsvg:active{cursor:grabbing}
  #mapsvg text{font:9px "Open Sans",Arial;fill:var(--ink)}
  #mapsvg .maphdr{font-family:Montserrat;font-weight:800;font-size:13px;fill:var(--silver);text-transform:uppercase;letter-spacing:.06em}
  #mapsvg .mnode{cursor:pointer}
  #mapsvg .mnode:hover text{fill:var(--red);font-weight:800}
  #mapsvg .mnode circle{stroke:#fff;stroke-width:1.2}
  #mapsvg .dot-floor{fill:var(--floor)} #mapsvg .dot-g56{fill:var(--g56)} #mapsvg .dot-g78{fill:var(--g78)} #mapsvg .dot-hs{fill:var(--hs)}
  .mapzoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
  .mapzoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font:700 15px Montserrat,Arial;box-shadow:var(--shadow);color:var(--dim)}
  .mapzoom button:hover{color:var(--red);border-color:var(--tomato)}
  .maphint{position:absolute;left:16px;bottom:14px;font-size:10.5px;color:var(--silver);letter-spacing:.05em;text-transform:uppercase;font-weight:700;pointer-events:none}
  @media(max-width:900px){.controls .seg.subj,.controls .chalbtn{display:none}}
  .results{position:absolute;top:50px;left:0;right:0;background:#fff;border:1px solid var(--line2);
    border-radius:12px;box-shadow:0 18px 50px rgba(16,16,16,.18);max-height:64vh;overflow:auto;z-index:40;
    display:none;padding:5px}
  .results.on{display:block}
  .rrow{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;gap:11px;align-items:baseline}
  .rrow:hover,.rrow.sel{background:#fff4f0}
  .rrow .code{font-weight:700;font-size:13px;white-space:nowrap;color:var(--night)}
  .rrow .rt{color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .rrow .g{font-size:10.5px;font-weight:700;color:#fff;background:var(--silver);border-radius:999px;padding:1px 8px;white-space:nowrap}

  /* ---------- stage (fixed height, no page scroll) ---------- */
  .stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .cols{position:relative;z-index:2;height:100%;display:grid;
    grid-template-columns:1fr minmax(320px,1.35fr) 1fr;gap:0;max-width:1240px;margin:0 auto;padding:0 20px}
  .col{min-height:0;height:100%;display:flex;flex-direction:column;padding:20px 14px}
  .col.side{overflow-y:auto;overflow-x:hidden}
  .col h3{margin:2px 6px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver);
    display:flex;align-items:center;gap:7px;font-weight:800}
  .col.pre h3{justify-content:flex-end}
  .col.pre h3 .n,.col.post h3 .n{color:var(--red)}
  .cardwrap{display:flex;flex-direction:column;gap:9px}
  .col.pre .cardwrap{align-items:flex-end}

  .chip{position:relative;display:block;width:100%;max-width:300px;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;font-family:inherit;
    box-shadow:var(--shadow);transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s,border-color .16s;
    animation:pop .28s cubic-bezier(.2,.8,.2,1) both}
  .col.pre .chip{text-align:right}
  .chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:#f3d3c8}
  .chip:active{transform:translateY(0) scale(.99)}
  .chip.cursel{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,60,29,.20),var(--shadow-lift);transform:translateY(-1px)}
  .chip.sug.cursel{border-color:var(--sug);box-shadow:0 0 0 3px rgba(63,102,200,.22),var(--shadow-lift)}
  .chip.curr.cursel{border-color:var(--curr);box-shadow:0 0 0 3px rgba(47,158,107,.22),var(--shadow-lift)}
  .chip .code{font-weight:800;font-size:13px;color:var(--night);display:flex;align-items:center;gap:7px}
  .col.pre .chip .code{flex-direction:row-reverse}
  .chip .ct{color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.35}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.floor{background:var(--floor)} .dot.g56{background:var(--g56)}
  .dot.g78{background:var(--g78)} .dot.hs{background:var(--hs)}
  .empty{color:var(--silver);font-size:12.5px;font-style:italic;padding:10px 6px;max-width:260px}
  .chip.sug{border-color:#c9d5ef;background:#fbfcff}
  .chip.sug:hover{border-color:var(--sug)}
  .chip.curr{border-color:#c9e9d5;background:#fbfffc}
  .chip.curr:hover{border-color:var(--curr)}
  .tag{font-size:9px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;
    padding:1px 6px;margin-left:7px;vertical-align:middle;border:1px solid}
  .tag.sug{color:var(--sug);background:#eef2fc;border-color:#d4ddf6}
  .tag.curr{color:var(--curr);background:#eafaf1;border-color:#c9ebd8}
  .col.pre .chip .tag{margin-left:0;margin-right:7px}
  .sugnote{color:var(--sug);font-weight:700}
  .currnote{color:var(--curr);font-weight:700}

  /* focus card */
  .midcol{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 10px}
  .focus{position:relative;width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:26px 26px 24px;box-shadow:0 3px 8px rgba(16,16,16,.05),0 26px 60px rgba(16,16,16,.10);
    animation:focusin .34s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
  .focus::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
    background:linear-gradient(90deg,var(--red),var(--tomato))}
  .focus .ember{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(251,84,52,.22),rgba(251,84,52,0) 68%);animation:pulse 4.5s ease-in-out infinite;pointer-events:none}
  .focus .badges{display:flex;align-items:center;gap:9px;margin-bottom:14px;position:relative}
  .gb{font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:3px 11px;font-family:Montserrat;letter-spacing:.02em}
  .gb.floor{background:var(--floor)} .gb.g56{background:var(--g56)}
  .gb.g78{background:var(--g78)} .gb.hs{background:var(--hs)}
  .focus .conn{font-size:11.5px;color:var(--silver);font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
  .focus .conn b{color:var(--red)}
  .focus .code{font-size:30px;font-weight:900;color:var(--night);letter-spacing:-.01em;line-height:1.05}
  .focus .title{font-size:16.5px;font-weight:700;color:var(--ink);margin:8px 0 0;font-family:Montserrat}
  .focus .text{font-size:13.5px;color:#444;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
    max-height:172px;overflow:auto}
  .focus .add{margin-top:16px;display:flex;gap:9px}
  .flowlabel{margin-top:16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--silver);text-align:center;font-weight:700}
  .flowlabel .k{color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-family:Montserrat}
  .focusrow{display:flex;align-items:center;gap:12px;width:100%;justify-content:center}
  .stepbtn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;
    color:var(--dim);font:400 22px/1 Montserrat,Arial;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s,border-color .15s,color .15s,box-shadow .15s;display:flex;align-items:center;justify-content:center}
  .stepbtn:hover:not(:disabled){border-color:var(--tomato);color:var(--red);transform:translateY(-1px);box-shadow:var(--shadow-lift)}
  .stepbtn:active:not(:disabled){transform:translateY(0) scale(.95)}
  .stepbtn:disabled{opacity:.28;cursor:default}
  #tip{position:fixed;z-index:70;max-width:300px;background:#14161c;color:#eef;font-size:12.5px;line-height:1.45;
    padding:9px 12px 10px;border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.3);pointer-events:none;display:none;opacity:0;
    transform:translateY(-3px);transition:opacity .14s,transform .14s;border-left:3px solid var(--sug)}
  #tip.on{opacity:1;transform:none}
  #tip b{display:block;color:#9db8ff;font-family:Montserrat;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
  #tip[data-kind="curr"]{border-left-color:var(--curr)}
  #tip[data-kind="curr"] b{color:#8fe0b8}
  #tip .tipcite{display:block;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.14);color:#aeb6c8;font-size:11px;font-style:italic}
  @media(max-width:860px){.stepbtn{display:none}}

  .btn{border:none;border-radius:10px;padding:9px 15px;font:700 13px Montserrat,Arial;cursor:pointer;
    transition:transform .12s,box-shadow .15s,background .15s;display:inline-flex;align-items:center;gap:7px}
  .btn:active{transform:translateY(1px)}
  .btn.red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(217,60,29,.28)}
  .btn.red:hover{background:var(--tomato);box-shadow:0 8px 22px rgba(251,84,52,.34)}
  .btn.ghost{background:transparent;color:var(--dim);border:1.5px solid var(--line2)}
  .btn.ghost:hover{color:var(--red);border-color:#f0c8bc}
  .btn.dark{background:#262626;color:#fff}
  .btn.dark:hover{background:#333}

  /* ---------- forge tray (dark) ---------- */
  .tray{flex:0 0 auto;background:var(--night);color:#fff;border-top:1px solid #000;
    box-shadow:0 -10px 40px rgba(0,0,0,.22)}
  .tray .inner{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;min-height:74px}
  .tray .head{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .tray .head .l{font:800 11px Montserrat;letter-spacing:.18em;text-transform:uppercase;color:#8b8b8b}
  .tray .head .c{font-size:12px;color:#cfcfcf;font-variant-numeric:tabular-nums}
  .tray .head .c b{color:var(--ember)}
  .strand{flex:1;display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:200px;min-height:40px}
  .snode{position:relative;display:inline-flex;flex-direction:column;gap:1px;cursor:pointer;
    background:linear-gradient(180deg,#2a2a2a,#1c1c1c);border:1px solid #3a3a3a;border-radius:10px;
    padding:6px 12px;transition:transform .14s,border-color .15s;animation:forge .4s cubic-bezier(.2,.8,.2,1) both}
  .snode:hover{transform:translateY(-2px);border-color:#5a5a5a}
  .snode.hot{background:linear-gradient(180deg,var(--tomato),var(--red));border-color:var(--ember);
    box-shadow:0 0 0 1px rgba(251,84,52,.5),0 6px 20px rgba(251,84,52,.4)}
  .snode .sc{font:800 12.5px Montserrat;color:#fff;letter-spacing:.01em}
  .snode .st{font-size:10px;color:#b7b7b7;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .snode.hot .st{color:#ffe6dd}
  .sarrow{color:#5a5a5a;font-weight:900;padding:0 5px;font-size:15px;align-self:center}
  .strand .placeholder{color:#6d6d6d;font-size:13px;font-style:italic}
  .tray .actions{display:flex;gap:9px;white-space:nowrap}

  /* ---------- animations ---------- */
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes focusin{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes forge{0%{opacity:0;transform:translateY(8px) scale(.7)}60%{transform:translateY(0) scale(1.06)}100%{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  @keyframes dash{to{stroke-dashoffset:-1000}}
  @keyframes spark{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:0;transform:scale(2.2)}}
  .spark{position:fixed;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle,#fff,var(--ember) 45%,rgba(251,84,52,0) 70%);pointer-events:none;z-index:60;animation:spark .6s ease-out forwards}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}

  .col.side::-webkit-scrollbar,.focus .text::-webkit-scrollbar,.results::-webkit-scrollbar{width:9px}
  .col.side::-webkit-scrollbar-thumb,.focus .text::-webkit-scrollbar-thumb,.results::-webkit-scrollbar-thumb{background:#dcd9d5;border-radius:9px;border:2px solid transparent;background-clip:content-box}

  @media (max-width:860px){
    body{overflow:auto}
    .app{height:auto;min-height:100vh}
    .stage{overflow:visible}
    #wires{display:none}
    .cols{grid-template-columns:1fr;height:auto}
    .col{height:auto}.col.side{overflow:visible}
    .col.pre h3,.col.pre .chip,.col.pre .cardwrap{text-align:left;justify-content:flex-start;align-items:stretch}
    .col.pre .chip .code{flex-direction:row}
    .tray{position:sticky;bottom:0}
  }
</style>
</head>

const DATA = {"nodes":{"5.NF.A.2":{"t":"Fraction +/− problems","g":"5","b":"g56","x":"Solve word problems involving addition and subtraction of fractions referring to the same whole, including cases of unlike denominators, e.g., by using visual fraction models or equations to represent the problem. Use benchmark fractions and number sense of fractions to estimate mentally and assess the reasonableness of answers. *For example, recognize an incorrect result $\\frac{2}{5} + \\frac{1}{2} = \\frac{3}{7}$, by observing that $\\frac{3}{7} < \\frac{1}{2}$.*"},"7.SP.A.1":{"t":"Samples represent populations","g":"7","b":"g78","x":"Understand that statistics can be used to gain information about a population by examining a sample of the population; generalizations about a population from a sample are valid only if the sample is representative of that population. Understand that random sampling tends to produce representative samples and support valid inferences."},"HSA-APR.C.4":{"t":"Polynomial identities","g":"9","b":"hs","x":"Prove polynomial identities and use them to describe numerical relationships. *For example, the polynomial identity $(x^{2} + y^{2})^{2} = (x^{2} — y^{2})^{2} + (2xy)^{2}$ can be used to generate Pythagorean triples.*"},"5.G.A.2":{"t":"Plot real-world points","g":"5","b":"g56","x":"Represent real world and mathematical problems by graphing points in the first quadrant of the coordinate plane, and interpret coordinate values of points in the context of the situation."},"HSG-GPE.B.5":{"t":"Slopes: parallel & perp.","g":"9","b":"hs","x":"Prove the slope criteria for parallel and perpendicular lines and use them to solve geometric problems (e.g., find the equation of a line parallel or perpendicular to a given line that passes through a given point)."},"7.SP.B.4":{"t":"Compare centers & spreads","g":"7","b":"g78","x":"Use measures of center and measures of variability for numerical data from random samples to draw informal comparative inferences about two populations. *For example, decide whether the words in a chapter of a seventh-grade science book are generally longer than the words in a chapter of a fourth-grade science book.*"},"6.NS.B.4":{"t":"GCF & LCM","g":"6","b":"g56","x":"Find the greatest common factor of two whole numbers less than or equal to 100 and the least common multiple of two whole numbers less than or equal to 12. Use the distributive property to express a sum of two whole numbers 1—100 with a common factor as a multiple of a sum of two whole numbers with no common factor. *For example, express $36 + 8$ as $4(9 + 2)$.*"},"8.EE.B.5":{"t":"Graph proportions; slope","g":"8","b":"g78","x":"Graph proportional relationships, interpreting the unit rate as the slope of the graph. Compare two different proportional relationships represented in different ways. *For example, compare a distance-time graph to a distance-time equation to determine which of two moving objects has greater speed.*"},"4.MD.A.1":{"t":"Unit conversions (intro)","g":"4","b":"floor","x":"Know relative sizes of measurement units within one system of units including km, m, cm; kg, g; lb, oz.; l, ml; hr, min, sec. Within a single system of measurement, express measurements in a larger unit in terms of a smaller unit. Record measurement equivalents in a two column table. *For example, know that 1 ft is 12 times as long as 1 in. Express the length of a 4 ft snake as 48 in. Generate a conversion table for feet and inches listing the number pairs (1, 12), (2, 24), (3, 36), …*"},"5.MD.B.2":{"t":"Make a line plot to display a data set of measurements i…","g":"5","b":"g56","x":"Make a line plot to display a data set of measurements in fractions of a unit ($\\frac{1}{2}$, $\\frac{1}{4}$, $\\frac{1}{8}$). Use operations on fractions for this grade to solve problems involving information presented in line plots. *For example, given different measurements of liquid in identical beakers, find the amount of liquid each beaker would contain if the total amount in all the beakers were redistributed equally.*"},"6.G.A.4":{"t":"Nets & surface area","g":"6","b":"g56","x":"Represent three-dimensional figures using nets made up of rectangles and triangles, and use the nets to find the surface area of these figures. Apply these techniques in the context of solving real-world and mathematical problems."},"HSS-CP.A.1":{"t":"Events as sets","g":"9","b":"hs","x":"Describe events as subsets of a sample space (the set of outcomes) using characteristics (or categories) of the outcomes, or as unions, intersections, or complements of other events (\"or,\" \"and,\" \"not\")."},"8.SP.A.2":{"t":"Line of best fit","g":"8","b":"g78","x":"Know that straight lines are widely used to model relationships between two quantitative variables. For scatter plots that suggest a linear association, informally fit a straight line, and informally assess the model fit by judging the closeness of the data points to the line."},"HSA-APR.B.2":{"t":"Remainder theorem","g":"9","b":"hs","x":"Know and apply the Remainder Theorem: For a polynomial p(x) and a number a, the remainder on division by x - a is p(a), so p(a) = 0 if and only if (x - a) is a factor of p(x)."},"8.EE.A.3":{"t":"Powers-of-10 estimates","g":"8","b":"g78","x":"Use numbers expressed in the form of a single digit times an integer power of 10 to estimate very large or very small quantities, and to express how many times as much one is than the other. *For example, estimate the population of the United States as $3 \\times 10^{8}$ and the population of the world as $7 \\times 10^{9}$, and determine that the world population is more than 20 times larger.*"},"HSS-CP.B.6":{"t":"Compute P(A|B)","g":"9","b":"hs","x":"Find the conditional probability of A given B as the fraction of B's outcomes that also belong to A, and interpret the answer in terms of the model."},"HSG-SRT.C.6":{"t":"Sine & cosine defined","g":"9","b":"hs","x":"Understand that by similarity, side ratios in right triangles are properties of the angles in the triangle, leading to definitions of trigonometric ratios for acute angles."},"8.EE.A.4":{"t":"Compute in sci notation","g":"8","b":"g78","x":"Perform operations with numbers expressed in scientific notation, including problems where both decimal and scientific notation are used. Use scientific notation and choose units of appropriate size for measurements of very large or very small quantities (e.g., use millimeters per year for seafloor spreading). Interpret scientific notation that has been generated by technology."},"7.SP.C.5":{"t":"What probability means","g":"7","b":"g78","x":"Understand that the probability of a chance event is a number between 0 and 1 that expresses the likelihood of the event occurring. Larger numbers indicate greater likelihood. A probability near 0 indicates an unlikely event, a probability around $\\frac{1}{2}$ indicates an event that is neither unlikely nor likely, and a probability near 1 indicates a likely event."},"4.NBT.A.2":{"t":"Read & compare big numbers","g":"4","b":"floor","x":"Read and write multi-digit whole numbers using base-ten numerals, number names, and expanded form. Compare two multi-digit numbers based on meanings of the digits in each place, using >, =, and < symbols to record the results of comparisons."},"7.EE.A.2":{"t":"Rewriting reveals meaning","g":"7","b":"g78","x":"Understand that rewriting an expression in different forms in a problem context can shed light on the problem and how the quantities in it are related. *For example, $a + 0.05a = 1.05a$ means that \"increase by 5%\" is the same as \"multiply by 1.05.\"*"},"6.NS.A.1":{"t":"Fraction ÷ fraction","g":"6","b":"g56","x":"Interpret and compute quotients of fractions, and solve word problems involving division of fractions by fractions, e.g., by using visual fraction models and equations to represent the problem. *For example, create a story context for $(\\frac{2}{3}) \\div (\\frac{3}{4})$ and use a visual fraction model to show the quotient; use the relationship between multiplication and division to explain that $(\\frac{2}{3}) \\div (\\frac{3}{4}) = \\frac{8}{9}$ because $\\frac{3}{4}$ of $\\frac{8}{9}$ is $\\frac{2}{3}$. (In general, $(\\frac{a}{b}) \\div (\\frac{c}{d}) = \\frac{ad}{bc}$.) How much chocolate will each person get if 3 people share $\\frac{1}{2}$ lb of chocolate equally? How many $\\frac{3}{4}$-cup servings are in $\\frac{2}{3}$ of a cup of yogurt? How wide is a rectangular strip of land with length $\\frac{3}{4}$ mi and area $\\frac{1}{2}$ square mi?*"},"4.MD.A.3":{"t":"Area & perimeter formulas","g":"4","b":"floor","x":"Apply the area and perimeter formulas for rectangles in real world and mathematical problems. *For example, find the width of a rectangular room given the area of the flooring and the length, by viewing the area formula as a multiplication equation with an unknown factor.*"},"HSA-REI.C.6":{"t":"Solve linear systems","g":"9","b":"hs","x":"Solve systems of linear equations exactly and approximately (e.g., with graphs), focusing on pairs of linear equations in two variables."},"5.NF.B.7.c":{"t":"Solve real world problems involving division of unit fra…","g":"5","b":"g56","x":"Solve real world problems involving division of unit fractions by non-zero whole numbers and division of whole numbers by unit fractions, e.g., by using visual fraction models and equations to represent the problem. *For example, how much chocolate will each person get if 3 people share $\\frac{1}{2}$ lb of chocolate equally? How many $\\frac{1}{3}$-cup servings are in 2 cups of raisins?*"},"3.OA.C.7":{"t":"Times tables from memory","g":"3","b":"floor","x":"Fluently multiply and divide within 100, using strategies such as the relationship between multiplication and division (e.g., knowing that $8 \\times 5 = 40$, one knows $40 \\div 5 = 8$) or properties of operations. By the end of Grade 3, know from memory all products of two one-digit numbers."},"4.MD.C.5.b":{"t":"*Recognize angles as geometric shapes that are formed wh…","g":"4","b":"floor","x":"*Recognize angles as geometric shapes that are formed wherever two rays share a common endpoint, and understand concepts of angle measurement:* an angle that turns through $n$ one-degree angles is said to have an angle measure of $n$ degrees."},"7.SP.A.2":{"t":"Infer from samples","g":"7","b":"g78","x":"Use data from a random sample to draw inferences about a population with an unknown characteristic of interest. Generate multiple samples (or simulated samples) of the same size to gauge the variation in estimates or predictions. *For example, estimate the mean word length in a book by randomly sampling words from the book; predict the winner of a school election based on randomly sampled survey data. Gauge how far off the estimate or prediction might be.*"},"HSF-IF.B.4":{"t":"Key features of graphs","g":"9","b":"hs","x":"For a function that models a relationship between two quantities, interpret key features of graphs and tables in terms of the quantities, and sketch graphs showing key features given a verbal description of the relationship."},"HSN-CN.C.9":{"t":"Fund. theorem of algebra","g":"9","b":"hs","x":"(+) Know the Fundamental Theorem of Algebra; show that it is true for quadratic polynomials."},"6.NS.C.8":{"t":"Four-quadrant graphing","g":"6","b":"g56","x":"Solve real-world and mathematical problems by graphing points in all four quadrants of the coordinate plane. Include use of coordinates and absolute value to find distances between points with the same first coordinate or the same second coordinate."},"HSA-CED.A.3":{"t":"Model with constraints","g":"9","b":"hs","x":"Represent constraints by equations or inequalities, and by systems of equations and/or inequalities, and interpret solutions as viable or nonviable options in a modeling context."},"HSF-IF.C.7.b":{"t":"Graph piecewise & roots","g":"9","b":"hs","x":"Graph square root, cube root, and piecewise-defined functions, including step functions and absolute value functions."},"3.OA.B.5":{"t":"Properties of ×","g":"3","b":"floor","x":"Apply properties of operations as strategies to multiply and divide."},"5.MD.C.4":{"t":"Measure volumes by counting unit cubes, using cubic cm,…","g":"5","b":"g56","x":"Measure volumes by counting unit cubes, using cubic cm, cubic in, cubic ft, and improvised units."},"6.NS.C.7.d":{"t":"Distinguish comparisons of absolute value from statement…","g":"6","b":"g56","x":"Distinguish comparisons of absolute value from statements about order. *For example, recognize that an account balance less than -30 dollars represents a debt greater than 30 dollars.*"},"5.NBT.A.3.b":{"t":"Compare two decimals to thousandths based on meanings of…","g":"5","b":"g56","x":"Compare two decimals to thousandths based on meanings of the digits in each place, using >, =, and < symbols to record the results of comparisons."},"HSS-ID.B.6.a":{"t":"Fit a model to data","g":"9","b":"hs","x":"Fit a function to the data; use functions fitted to data to solve problems in the context of the data."},"5.NF.B.6":{"t":"Fraction × problems","g":"5","b":"g56","x":"Solve real world problems involving multiplication of fractions and mixed numbers, e.g., by using visual fraction models or equations to represent the problem."},"7.SP.C.8.b":{"t":"Represent sample spaces for compound events using method…","g":"7","b":"g78","x":"Represent sample spaces for compound events using methods such as organized lists, tables and tree diagrams. For an event described in everyday language (e.g., \"rolling double sixes\"), identify the outcomes in the sample space which compose the event."},"HSG-MG.A.2":{"t":"Density models","g":"9","b":"hs","x":"Apply concepts of density based on area and volume in modeling situations (e.g., persons per square mile, BTUs per cubic foot)."},"HSS-ID.A.1":{"t":"Data displays (HS)","g":"9","b":"hs","x":"Represent data with plots on the real number line (dot plots, histograms, and box plots)."},"HSA-APR.A.1":{"t":"Add/multiply polynomials","g":"9","b":"hs","x":"Understand that polynomials form a system analogous to the integers, namely, they are closed under the operations of addition, subtraction, and multiplication; add, subtract, and multiply polynomials."},"HSS-CP.A.3":{"t":"Conditional probability","g":"9","b":"hs","x":"Understand the conditional probability of A given B as $\\frac{P(A and B)}{P(B)}$, and interpret independence of A and B as saying that the conditional probability of A given B is the same as the probability of A, and the conditional probability of B given A is the same as the probability of B."},"HSG-GPE.A.2":{"t":"Parabola: focus/directrix","g":"9","b":"hs","x":"Derive the equation of a parabola given a focus and directrix."},"5.NBT.B.7":{"t":"Decimal arithmetic (intro)","g":"5","b":"g56","x":"Add, subtract, multiply, and divide decimals to hundredths, using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method and explain the reasoning used."},"2.NBT.B.7":{"t":"Add/subtract within 1000","g":"2","b":"floor","x":"Add and subtract within 1000, using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method. Understand that in adding or subtracting three-digit numbers, one adds or subtracts hundreds and hundreds, tens and tens, ones and ones; and sometimes it is necessary to compose or decompose tens or hundreds."},"7.SP.B.3":{"t":"Overlap of distributions","g":"7","b":"g78","x":"Informally assess the degree of visual overlap of two numerical data distributions with similar variabilities, measuring the difference between the centers by expressing it as a multiple of a measure of variability. *For example, the mean height of players on the basketball team is 10 cm greater than the mean height of players on the soccer team, about twice the variability (mean absolute deviation) on either team; on a dot plot, the separation between the two distributions of heights is noticeable.*"},"8.G.B.6":{"t":"Pythagorean proof","g":"8","b":"g78","x":"Explain a proof of the Pythagorean Theorem and its converse."},"HSF-IF.C.8.a":{"t":"Analyze quadratic forms","g":"9","b":"hs","x":"Use the process of factoring and completing the square in a quadratic function to show zeros, extreme values, and symmetry of the graph, and interpret these in terms of a context."},"HSF-LE.A.4":{"t":"Solve with logarithms","g":"9","b":"hs","x":"For exponential models, express as a logarithm the solution to $ab^{ct} = d$ where a, c, and d are numbers and the base b is 2, 10, or e; evaluate the logarithm using technology."},"HSF-IF.C.7.d":{"t":"Graph rational functions","g":"9","b":"hs","x":"(+) Graph rational functions, identifying zeros and asymptotes when suitable factorizations are available, and showing end behavior."},"5.G.B.4":{"t":"Shape hierarchy","g":"5","b":"g56","x":"Classify two-dimensional figures in a hierarchy based on properties."},"HSS-IC.B.4":{"t":"Margin of error","g":"9","b":"hs","x":"Use data from a sample survey to estimate a population mean or proportion; develop a margin of error through the use of simulation models for random sampling."},"8.G.A.5":{"t":"Parallel-line angle facts","g":"8","b":"g78","x":"Use informal arguments to establish facts about the angle sum and exterior angle of triangles, about the angles created when parallel lines are cut by a transversal, and the angle-angle criterion for similarity of triangles. *For example, arrange three copies of the same triangle so that the sum of the three angles appears to form a line, and give an argument in terms of transversals why this is so.*"},"HSF-TF.B.6":{"t":"Inverse trig setup","g":"9","b":"hs","x":"(+) Understand that restricting a trigonometric function to a domain on which it is always increasing or always decreasing allows its inverse to be constructed."},"HSA-CED.A.1":{"t":"Write equations (1 var)","g":"9","b":"hs","x":"Create equations and inequalities in one variable and use them to solve problems. Include equations arising from linear and quadratic functions, and simple rational and exponential functions."},"3.OA.A.4":{"t":"Find the missing factor","g":"3","b":"floor","x":"Determine the unknown whole number in a multiplication or division equation relating three whole numbers. *For example, determine the unknown number that makes the equation true in each of the equations $8 \\times ? = 48$, $5 = \\Box \\div 3$, $6 \\times 6 = ?$.*"},"7.EE.A.1":{"t":"Work linear expressions","g":"7","b":"g78","x":"Apply properties of operations as strategies to add, subtract, factor, and expand linear expressions with rational coefficients."},"7.RP.A.2.a":{"t":"Decide whether two quantities are in a proportional rela…","g":"7","b":"g78","x":"Decide whether two quantities are in a proportional relationship, e.g., by testing for equivalent ratios in a table or graphing on a coordinate plane and observing whether the graph is a straight line through the origin."},"7.SP.C.6":{"t":"Long-run frequency","g":"7","b":"g78","x":"Approximate the probability of a chance event by collecting data on the chance process that produces it and observing its long-run relative frequency, and predict the approximate relative frequency given the probability. *For example, when rolling a number cube 600 times, predict that a 3 or 6 would be rolled roughly 200 times, but probably not exactly 200 times.*"},"HSA-SSE.A.2":{"t":"Use expression structure","g":"9,10,11,12","b":"hs","x":"Use the structure of an expression to identify ways to rewrite it. *For example, see $x_{4} — y_{4}$ as $(x^{2})^{2} — (y^{2})^{2}$, thus recognizing it as a difference of squares that can be factored as $(x^{2} — y^{2})(x^{2} + y^{2})$.*"},"HSF-LE.B.5":{"t":"Interpret model parameters","g":"9","b":"hs","x":"Interpret the parameters in a linear or exponential function in terms of a context."},"5.G.B.3":{"t":"Shape attributes inherit","g":"5","b":"g56","x":"Understand that attributes belonging to a category of two-dimensional figures also belong to all subcategories of that category. *For example, all rectangles have four right angles and squares are rectangles, so all squares have four right angles.*"},"4.NBT.A.3":{"t":"Round multi-digit numbers","g":"4","b":"floor","x":"Use place value understanding to round multi-digit whole numbers to any place."},"4.OA.A.2":{"t":"×/÷ comparison problems","g":"4","b":"floor","x":"Multiply or divide to solve word problems involving multiplicative comparison, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem, distinguishing multiplicative comparison from additive comparison."},"HSS-ID.C.8":{"t":"Correlation coefficient","g":"9","b":"hs","x":"Compute (using technology) and interpret the correlation coefficient of a linear fit."},"HSS-ID.C.7":{"t":"Interpret fit parameters","g":"9","b":"hs","x":"Interpret the slope (rate of change) and the intercept (constant term) of a linear model in the context of the data."},"7.SP.C.8.a":{"t":"Understand that, just as with simple events, the probabi…","g":"7","b":"g78","x":"Understand that, just as with simple events, the probability of a compound event is the fraction of outcomes in the sample space for which the compound event occurs."},"2.MD.A.2":{"t":"Measure in two units","g":"2","b":"floor","x":"Measure the length of an object twice, using length units of different lengths for the two measurements; describe how the two measurements relate to the size of the unit chosen."},"4.NF.A.1":{"t":"Equivalent fractions","g":"4","b":"floor","x":"Explain why a fraction $\\frac{a}{b}$ is equivalent to a fraction $\\frac{(n \\times a)}{(n \\times b)}$ by using visual fraction models, with attention to how the number and size of the parts differ even though the two fractions themselves are the same size. Use this principle to recognize and generate equivalent fractions."},"HSG-GPE.A.3":{"t":"Ellipses & hyperbolas","g":"9","b":"hs","x":"(+) Derive the equations of ellipses and hyperbolas given the foci, using the fact that the sum or difference of distances from the foci is constant."},"3.MD.B.4":{"t":"Rulers & line plots","g":"3","b":"floor","x":"Generate measurement data by measuring lengths using rulers marked with halves and fourths of an inch. Show the data by making a line plot, where the horizontal scale is marked off in appropriate units— whole numbers, halves, or quarters."},"HSF-IF.C.9":{"t":"Compare functions (mixed)","g":"9","b":"hs","x":"Compare properties of two functions each represented in a different way (algebraically, graphically, numerically in tables, or by verbal descriptions). *For example, given a graph of one quadratic function and an algebraic expression for another, say which has the larger maximum.*"},"6.SP.B.5.b":{"t":"*Summarize numerical data sets in relation to their cont…","g":"6","b":"g56","x":"*Summarize numerical data sets in relation to their context, such as by* describing the nature of the attribute under investigation, including how it was measured and its units of measurement."},"5.NF.B.4.a":{"t":"Interpret the product $(\\frac{a}{b}) \\times q$ as a part…","g":"5","b":"g56","x":"Interpret the product $(\\frac{a}{b}) \\times q$ as a parts of a partition of $q$ into b equal parts; equivalently, as the result of a sequence of operations $a \\times q \\div b$. *For example, use a visual fraction model to show $(\\frac{2}{3}) \\times 4 = 8 \\div 3$, and create a story context for this equation. Do the same with $(\\frac{2}{3}) \\times (\\frac{4}{5}) = \\frac{8}{15}$. (In general, $(\\frac{a}{b}) \\times (\\frac{c}{d}) = \\frac{ac}{bd}$.)*"},"HSF-BF.B.4":{"t":"Inverse functions","g":"9","b":"hs","x":"Find inverse functions."},"6.G.A.2":{"t":"Fractional volume","g":"6","b":"g56","x":"Find the volume of a right rectangular prism with fractional edge lengths by packing it with unit cubes of the appropriate unit fraction edge lengths, and show that the volume is the same as would be found by multiplying the edge lengths of the prism. Apply the formulas $V = l w h$ and $V = b h$ to find volumes of right rectangular prisms with fractional edge lengths in the context of solving real-world and mathematical problems."},"7.G.A.3":{"t":"Cross-sections","g":"7","b":"g78","x":"Describe the two-dimensional figures that result from slicing three-dimensional figures, as in plane sections of right rectangular prisms and right rectangular pyramids."},"3.MD.C.7.a":{"t":"Find the area of a rectangle with whole-number side leng…","g":"3","b":"floor","x":"Find the area of a rectangle with whole-number side lengths by tiling it, and show that the area is the same as would be found by multiplying the side lengths."},"HSG-MG.A.3":{"t":"Design with geometry","g":"9","b":"hs","x":"Apply geometric methods to solve design problems (e.g., designing an object or structure to satisfy physical constraints or minimize cost; working with typographic grid systems based on ratios)."},"HSF-LE.A.2":{"t":"Construct linear & exp","g":"9","b":"hs","x":"Construct linear and exponential functions, including arithmetic and geometric sequences, given a graph, a description of a relationship, or two input-output pairs (include reading these from a table)."},"5.NBT.A.1":{"t":"Places ×10 and 1/10","g":"5","b":"g56","x":"Recognize that in a multi-digit number, a digit in one place represents 10 times as much as it represents in the place to its right and $\\frac{1}{10}$ of what it represents in the place to its left."},"HSF-LE.A.3":{"t":"Exponential beats polynomial","g":"9","b":"hs","x":"Observe using graphs and tables that a quantity increasing exponentially eventually exceeds a quantity increasing linearly, quadratically, or (more generally) as a polynomial function."},"8.EE.C.8.b":{"t":"Solve systems of two linear equations in two variables a…","g":"8","b":"g78","x":"Solve systems of two linear equations in two variables algebraically, and estimate solutions by graphing the equations. Solve simple cases by inspection. *For example, 3x + 2y = 5 and 3x + 2y = 6 have no solution because 3x + 2y cannot simultaneously be 5 and 6.*"},"5.MD.C.5":{"t":"Recognize volume as additive. Find volumes of solid figu…","g":"5","b":"g56","x":"Recognize volume as additive. Find volumes of solid figures composed of two non-overlapping right rectangular prisms by adding the volumes of the non-overlapping parts, applying this technique to solve real world problems."},"HSS-IC.B.3":{"t":"Surveys vs experiments","g":"9","b":"hs","x":"Recognize the purposes of and differences among sample surveys, experiments, and observational studies; explain how randomization relates to each."},"4.NBT.B.5":{"t":"Multiply multi-digit (intro)","g":"4","b":"floor","x":"Multiply a whole number of up to four digits by a one-digit whole number, and multiply two two-digit numbers, using strategies based on place value and the properties of operations. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models."},"4.NF.B.4.b":{"t":"Understand a multiple of $\\frac{a}{b}$ as a multiple of…","g":"4","b":"floor","x":"Understand a multiple of $\\frac{a}{b}$ as a multiple of $\\frac{1}{b}$, and use this understanding to multiply a fraction by a whole number. *For example, use a visual fraction model to express $3 \\times (\\frac{2}{5})$ as $6 \\times (\\frac{1}{5})$, recognizing this product as $\\frac{6}{5}$. (In general, $n \\times (\\frac{a}{b}) = \\frac{(n \\times a)}{b}$.)*"},"HSF-IF.A.1":{"t":"What f(x) means","g":"9","b":"hs","x":"Understand that a function from one set (called the domain) to another set (called the range) assigns to each element of the domain exactly one element of the range. If f is a function and x is an element of its domain, then f(x) denotes the output of f corresponding to the input x. The graph of f is the graph of the equation y = f(x)."},"4.MD.A.2":{"t":"Measurement word problems","g":"4","b":"floor","x":"Use the four operations to solve word problems involving distances, intervals of time, liquid volumes, masses of objects, and money, including problems involving simple fractions or decimals, and problems that require expressing measurements given in a larger unit in terms of a smaller unit. Represent measurement quantities using diagrams such as number line diagrams that feature a measurement scale."},"HSA-SSE.B.4":{"t":"Geometric series sum","g":"9","b":"hs","x":"Derive the formula for the sum of a finite geometric series (when the common ratio is not 1), and use the formula to solve problems. *For example, calculate mortgage payments.*"},"HSS-ID.B.5":{"t":"Two-way table trends","g":"9","b":"hs","x":"Summarize categorical data for two categories in two-way frequency tables. Interpret relative frequencies in the context of the data (including joint, marginal, and conditional relative frequencies). Recognize possible associations and trends in the data."},"3.MD.C.7.b":{"t":"Multiply side lengths to find areas of rectangles with w…","g":"3","b":"floor","x":"Multiply side lengths to find areas of rectangles with whole-number side lengths in the context of solving real world and mathematical problems, and represent whole-number products as rectangular areas in mathematical reasoning."},"8.EE.C.7.b":{"t":"Solve linear equations with rational number coefficients…","g":"8","b":"g78","x":"Solve linear equations with rational number coefficients, including equations whose solutions require expanding expressions using the distributive property and collecting like terms."},"HSG-SRT.A.2":{"t":"What similar means","g":"9","b":"hs","x":"Given two figures, use the definition of similarity in terms of similarity transformations to decide if they are similar; explain using similarity transformations the meaning of similarity for triangles as the equality of all corresponding pairs of angles and the proportionality of all corresponding pairs of sides."},"7.SP.C.7.b":{"t":"Develop a probability model (which may not be uniform) b…","g":"7","b":"g78","x":"Develop a probability model (which may not be uniform) by observing frequencies in data generated from a chance process. *For example, find the approximate probability that a spinning penny will land heads up or that a tossed paper cup will land open-end down. Do the outcomes for the spinning penny appear to be equally likely based on the observed frequencies?*"},"2.MD.B.6":{"t":"Number-line + and −","g":"2","b":"floor","x":"Represent whole numbers as lengths from 0 on a number line diagram with equally spaced points corresponding to the numbers 0, 1, 2, …, and represent whole-number sums and differences within 100 on a number line diagram."},"8.F.B.5":{"t":"Read a graph's story","g":"8","b":"g78","x":"Describe qualitatively the functional relationship between two quantities by analyzing a graph (e.g., where the function is increasing or decreasing, linear or nonlinear). Sketch a graph that exhibits the qualitative features of a function that has been described verbally."},"HSS-ID.B.6.b":{"t":"Residuals","g":"9","b":"hs","x":"Informally assess the fit of a function by plotting and analyzing residuals."},"HSS-ID.B.6.c":{"t":"Eyeball a line of fit","g":"9","b":"hs","x":"Fit a linear function for a scatter plot that suggests a linear association."},"1.OA.D.8":{"t":"Find the missing number","g":"1","b":"floor","x":"Determine the unknown whole number in an addition or subtraction equation relating three whole numbers. *For example, determine the unknown number that makes the equation true in each of the equations $8 + ? = 11, 5 = \\Box  - 3, 6 + 6 = \\Box$.*"},"6.NS.C.7.b":{"t":"Write, interpret, and explain statements of order for ra…","g":"6","b":"g56","x":"Write, interpret, and explain statements of order for rational numbers in real-world contexts. *For example, write $-3 \\degree C > -7 \\degree C$ to express the fact that $-3 \\degree C$ is warmer than $-7 \\degree C$.*"},"4.NF.B.3.a":{"t":"Understand addition and subtraction of fractions as join…","g":"4","b":"floor","x":"Understand addition and subtraction of fractions as joining and separating parts referring to the same whole."},"HSG-SRT.C.8":{"t":"Right-triangle trig","g":"9","b":"hs","x":"Use trigonometric ratios and the Pythagorean Theorem to solve right triangles in applied problems."},"4.MD.C.5.a":{"t":"*Recognize angles as geometric shapes that are formed wh…","g":"4","b":"floor","x":"*Recognize angles as geometric shapes that are formed wherever two rays share a common endpoint, and understand concepts of angle measurement:* an angle is measured with reference to a circle with its center at the common endpoint of the rays, by considering the fraction of the circular arc between the points where the two rays intersect the circle. An angle that turns through 1/360 of a circle is called a \"one-degree angle,\" and can be used to measure angles."},"3.OA.D.8":{"t":"Two-step word problems","g":"3","b":"floor","x":"Solve two-step word problems using the four operations. Represent these problems using equations with a letter standing for the unknown quantity. Assess the reasonableness of answers using mental computation and estimation strategies including rounding."},"HSG-CO.C.10":{"t":"Prove triangle theorems","g":"9","b":"hs","x":"Prove theorems about triangles."},"5.NF.A.1":{"t":"Add/sub unlike fractions","g":"5","b":"g56","x":"Add and subtract fractions with unlike denominators (including mixed numbers) by replacing given fractions with equivalent fractions in such a way as to produce an equivalent sum or difference of fractions with like denominators. *For example, $\\frac{2}{3} + \\frac{5}{4} = \\frac{8}{12} + \\frac{15}{12} = \\frac{23}{12}$. (In general, $\\frac{a}{b} + \\frac{c}{d} = \\frac{(ad + bc)}{bd}$.)*"},"6.RP.A.3.a":{"t":"Make tables of equivalent ratios relating quantities wit…","g":"6","b":"g56","x":"Make tables of equivalent ratios relating quantities with whole number measurements, find missing values in the tables, and plot the pairs of values on the coordinate plane. Use tables to compare ratios."},"6.NS.C.6.b":{"t":"Understand signs of numbers in ordered pairs as indicati…","g":"6","b":"g56","x":"Understand signs of numbers in ordered pairs as indicating locations in quadrants of the coordinate plane; recognize that when two ordered pairs differ only by signs, the locations of the points are related by reflections across one or both axes."},"HSS-IC.B.5":{"t":"Experiment comparisons","g":"9","b":"hs","x":"Use data from a randomized experiment to compare two treatments; use simulations to decide if differences between parameters are significant."},"HSG-CO.A.1":{"t":"Define geometric terms","g":"9,10,11,12","b":"hs","x":"Know precise definitions of angle, circle, perpendicular line, parallel line, and line segment, based on the undefined notions of point, line, distance along a line, and distance around a circular arc."},"HSN-Q.A.1":{"t":"Reason with units","g":"9","b":"hs","x":"Use units as a way to understand problems and to guide the solution of multi-step problems; choose and interpret units consistently in formulas; choose and interpret the scale and the origin in graphs and data displays."},"8.G.B.7":{"t":"Use a²+b²=c²","g":"8","b":"g78","x":"Apply the Pythagorean Theorem to determine unknown side lengths in right triangles in real-world and mathematical problems in two and three dimensions."},"6.RP.A.3.b":{"t":"Solve unit rate problems including those involving unit…","g":"6","b":"g56","x":"Solve unit rate problems including those involving unit pricing and constant speed. *For example, if it took 7 hours to mow 4 lawns, then at that rate, how many lawns could be mowed in 35 hours? At what rate were lawns being mowed?*"},"HSF-LE.A.1":{"t":"Linear vs exponential","g":"9","b":"hs","x":"Distinguish between situations that can be modeled with linear functions and with exponential functions."},"2.G.A.3":{"t":"Halves, thirds, fourths","g":"2","b":"floor","x":"Partition circles and rectangles into two, three, or four equal shares, describe the shares using the words halves, thirds, half of, a third of, etc., and describe the whole as two halves, three thirds, four fourths. Recognize that equal shares of identical wholes need not have the same shape."},"HSF-IF.C.7.a":{"t":"Graph lines & parabolas","g":"9","b":"hs","x":"Graph linear and quadratic functions and show intercepts, maxima, and minima."},"HSG-CO.B.8":{"t":"ASA, SAS, SSS","g":"9","b":"hs","x":"Explain how the criteria for triangle congruence (ASA, SAS, and SSS) follow from the definition of congruence in terms of rigid motions."},"6.G.A.3":{"t":"Polygons on coordinates","g":"6","b":"g56","x":"Draw polygons in the coordinate plane given coordinates for the vertices; use coordinates to find the length of a side joining points with the same first coordinate or the same second coordinate. Apply these techniques in the context of solving real-world and mathematical problems."},"HSA-CED.A.2":{"t":"Write equations (2 vars)","g":"9","b":"hs","x":"Create equations in two or more variables to represent relationships between quantities; graph equations on coordinate axes with labels and scales."},"8.G.B.8":{"t":"Coordinate distances","g":"8","b":"g78","x":"Apply the Pythagorean Theorem to find the distance between two points in a coordinate system."},"6.SP.B.5.c":{"t":"*Summarize numerical data sets in relation to their cont…","g":"6","b":"g56","x":"*Summarize numerical data sets in relation to their context, such as by* giving quantitative measures of center (median and/or mean) and variability (interquartile range and/or mean absolute deviation), as well as describing any overall pattern and any striking deviations from the overall pattern with reference to the context in which the data were gathered."},"7.G.B.5":{"t":"Angle-pair equations","g":"7","b":"g78","x":"Use facts about supplementary, complementary, vertical, and adjacent angles in a multi-step problem to write and solve simple equations for an unknown angle in a figure."},"4.MD.B.4":{"t":"Fraction line plots","g":"4","b":"floor","x":"Make a line plot to display a data set of measurements in fractions of a unit ($\\frac{1}{2}$, $\\frac{1}{4}$, $\\frac{1}{8}$). Solve problems involving addition and subtraction of fractions by using information presented in line plots. *For example, from a line plot find and interpret the difference in length between the longest and shortest specimens in an insect collection.*"},"4.NF.B.3.b":{"t":"Decompose a fraction into a sum of fractions with the sa…","g":"4","b":"floor","x":"Decompose a fraction into a sum of fractions with the same denominator in more than one way, recording each decomposition by an equation. Justify decompositions, e.g., by using a visual fraction model."},"6.SP.A.2":{"t":"Center, spread, shape","g":"6","b":"g56","x":"Understand that a set of data collected to answer a statistical question has a distribution which can be described by its center, spread, and overall shape."},"6.RP.A.1":{"t":"The ratio concept","g":"6","b":"g56","x":"Understand the concept of a ratio and use ratio language to describe a ratio relationship between two quantities. *For example, \"The ratio of wings to beaks in the bird house at the zoo was 2:1, because for every 2 wings there was 1 beak.\" \"For every vote candidate A received, candidate C received nearly three votes.\"*"},"4.G.A.3":{"t":"Line symmetry","g":"4","b":"floor","x":"Recognize a line of symmetry for a two-dimensional figure as a line across the figure such that the figure can be folded along the line into matching parts. Identify line-symmetric figures and draw lines of symmetry."},"5.OA.B.3":{"t":"Patterns → ordered pairs","g":"5","b":"g56","x":"Generate two numerical patterns using two given rules. Identify apparent relationships between corresponding terms. Form ordered pairs consisting of corresponding terms from the two patterns, and graph the ordered pairs on a coordinate plane. *For example, given the rule \"Add 3\" and the starting number 0, and given the rule \"Add 6\" and the starting number 0, generate terms in the resulting sequences, and observe that the terms in one sequence are twice the corresponding terms in the other sequence. Explain informally why this is so.*"},"6.RP.A.3.c":{"t":"Find a percent of a quantity as a rate per 100 (e.g., 30…","g":"6","b":"g56","x":"Find a percent of a quantity as a rate per 100 (e.g., 30% of a quantity means 30/100 times the quantity); solve problems involving finding the whole, given a part and the percent."},"HSG-MG.A.1":{"t":"Model with shapes","g":"9","b":"hs","x":"Use geometric shapes, their measures, and their properties to describe objects (e.g., modeling a tree trunk or a human torso as a cylinder)."},"6.NS.B.2":{"t":"Long-division fluency","g":"6","b":"g56","x":"Fluently divide multi-digit numbers using the standard algorithm."},"HSA-REI.A.1":{"t":"Justify solving steps","g":"9","b":"hs","x":"Explain each step in solving a simple equation as following from the equality of numbers asserted at the previous step, starting from the assumption that the original equation has a solution. Construct a viable argument to justify a solution method."},"HSA-REI.D.10":{"t":"Graph = solution set","g":"9","b":"hs","x":"Understand that the graph of an equation in two variables is the set of all its solutions plotted in the coordinate plane, often forming a curve (which could be a line)."},"4.OA.B.4":{"t":"Factors & multiples","g":"4","b":"floor","x":"Find all factor pairs for a whole number in the range 1—100. Recognize that a whole number is a multiple of each of its factors. Determine whether a given whole number in the range 1—100 is a multiple of a given one-digit number. Determine whether a given whole number in the range 1—100 is prime or composite."},"1.OA.B.3":{"t":"Add/subtract strategies","g":"1","b":"floor","x":"Apply properties of operations as strategies to add and subtract."},"5.MD.C.3":{"t":"Recognize volume as an attribute of solid figures and un…","g":"5","b":"g56","x":"Recognize volume as an attribute of solid figures and understand concepts of volume measurement."},"HSG-GMD.A.3":{"t":"Use volume formulas","g":"9","b":"hs","x":"Use volume formulas for cylinders, pyramids, cones, and spheres to solve problems."},"8.NS.A.3":{"t":"Closure of rationals (NJ)","g":"8","b":"g78","x":"Understand that the sum or product of two rational numbers is rational; that the sum of a rational number and an irrational number is irrational; and that the product of a nonzero rational number and an irrational number is irrational."},"HSG-GMD.B.4":{"t":"Slices & solids of rotation","g":"9","b":"hs","x":"Identify the shapes of two-dimensional cross-sections of three-dimensional objects, and identify three-dimensional objects generated by rotations of two-dimensional objects."},"HSG-GMD.A.1":{"t":"Why volume formulas work","g":"9","b":"hs","x":"Give an informal argument for the formulas for the circumference of a circle, area of a circle, volume of a cylinder, pyramid, and cone."},"HSF-IF.C.7.e":{"t":"Graph exp & log","g":"9","b":"hs","x":"Graph exponential and logarithmic functions, showing intercepts and end behavior, and trigonometric functions, showing period, midline, and amplitude."},"HSF-BF.A.1.b":{"t":"Combine functions","g":"9","b":"hs","x":"Combine standard function types using arithmetic operations."},"7.NS.A.2.c":{"t":"Apply properties of operations as strategies to multiply…","g":"7","b":"g78","x":"Apply properties of operations as strategies to multiply and divide rational numbers."},"2.G.A.1":{"t":"Name & draw shapes","g":"2","b":"floor","x":"Recognize and draw shapes having specified attributes, such as a given number of angles or a given number of equal faces. Identify triangles, quadrilaterals, pentagons, hexagons, and cubes."},"5.DL.A.3":{"t":"Clean messy data","g":"5","b":"g56","x":"Collect and clean data to be analyzable (e.g., make sure each entry is formatted correctly, deal with missing or incomplete data)."},"8.G.A.4":{"t":"Similarity via dilations","g":"8","b":"g78","x":"Understand that a two-dimensional figure is similar to another if the second can be obtained from the first by a sequence of rotations, reflections, translations, and dilations; given two similar two-dimensional figures, describe a sequence that exhibits the similarity between them."},"5.NF.B.5.a":{"t":"*Interpret multiplication as scaling (resizing), by* com…","g":"5","b":"g56","x":"*Interpret multiplication as scaling (resizing), by* comparing the size of a product to the size of one factor on the basis of the size of the other factor, without performing the indicated multiplication."},"4.OA.A.1":{"t":"Multiplication as comparison","g":"4","b":"floor","x":"Interpret a multiplication equation as a comparison, e.g., interpret $35 = 5 \\times 7$ as a statement that 35 is 5 times as many as 7 and 7 times as many as 5. Represent verbal statements of multiplicative comparisons as multiplication equations."},"HSS-ID.A.2":{"t":"Compare center & spread","g":"9","b":"hs","x":"Use statistics appropriate to the shape of the data distribution to compare center (median, mean) and spread (interquartile range, standard deviation) of two or more different data sets."},"1.OA.B.4":{"t":"Subtraction as unknown addend","g":"1","b":"floor","x":"Understand subtraction as an unknown-addend problem. *For example, subtract 10 - 8 by finding the number that makes 10 when added to 8.*"},"HSF-IF.B.6":{"t":"Average rate of change","g":"9","b":"hs","x":"Calculate and interpret the average rate of change of a function (presented symbolically or as a table) over a specified interval. Estimate the rate of change from a graph."},"5.OA.A.1":{"t":"Evaluate with parentheses","g":"5","b":"g56","x":"Use parentheses, brackets, or braces in numerical expressions, and evaluate expressions with these symbols."},"HSF-BF.A.1.a":{"t":"Build a function rule","g":"9","b":"hs","x":"Determine an explicit expression, a recursive process, or steps for calculation from a context."},"HSG-SRT.A.3":{"t":"AA similarity","g":"9","b":"hs","x":"Use the properties of similarity transformations to establish the AA criterion for two triangles to be similar."},"7.SP.C.8.c":{"t":"Design and use a simulation to generate frequencies for…","g":"7","b":"g78","x":"Design and use a simulation to generate frequencies for compound events. *For example, use random digits as a simulation tool to approximate the answer to the question: If 40% of donors have type A blood, what is the probability that it will take at least 4 donors to find one with type A blood?*"},"6.EE.A.2.b":{"t":"Identify parts of an expression using mathematical terms…","g":"6","b":"g56","x":"Identify parts of an expression using mathematical terms (sum, term, product, factor, quotient, coefficient); view one or more parts of an expression as a single entity. *For example, describe the expression $2(8 + 7)$ as a product of two factors; view (8 + 7) as both a single entity and a sum of two terms.*"},"7.RP.A.1":{"t":"Complex unit rates","g":"7","b":"g78","x":"Compute unit rates associated with ratios of fractions, including ratios of lengths, areas and other quantities measured in like or different units. *For example, if a person walks $\\frac{1}{2}$ mile in each $\\frac{1}{4}$ hour, compute the unit rate as the complex fraction $\\frac{\\frac{1}{2}}{\\frac{1}{4}}$  miles per hour, equivalently 2 miles per hour.*"},"3.OA.A.3":{"t":"×/÷ word problems","g":"3","b":"floor","x":"Use multiplication and division within 100 to solve word problems in situations involving equal groups, arrays, and measurement quantities, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem."},"HSS-IC.B.6":{"t":"Evaluate data reports","g":"9","b":"hs","x":"Evaluate reports based on data."},"6.EE.B.8":{"t":"Write & graph inequalities","g":"6","b":"g56","x":"Write an inequality of the form x > c or x < c to represent a constraint or condition in a real-world or mathematical problem. Recognize that inequalities of the form x > c or x < c have infinitely many solutions; represent solutions of such inequalities on number line diagrams."},"7.G.B.6":{"t":"Solve with area & volume","g":"7","b":"g78","x":"Solve real-world and mathematical problems involving area, volume and surface area of two- and three-dimensional objects composed of triangles, quadrilaterals, polygons, cubes, and right prisms."},"5.DL.A.2":{"t":"Collect & display data","g":"5","b":"g56","x":"Develop strategies to collect, organize and represent data of various types and from various sources. Communicate results digitally through a data visual (e.g. chart, storyboard, video presentation)."},"7.NS.A.2.a":{"t":"Understand that multiplication is extended from fraction…","g":"7","b":"g78","x":"Understand that multiplication is extended from fractions to rational numbers by requiring that operations continue to satisfy the properties of operations, particularly the distributive property, leading to products such as (-1)(-1) = 1 and the rules for multiplying signed numbers. Interpret products of rational numbers by describing real-world contexts."},"3.NF.A.1":{"t":"What a fraction is","g":"3","b":"floor","x":"Understand a fraction $\\frac{1}{b}$ as the quantity formed by 1 part when a whole is partitioned into b equal parts; understand a fraction $\\frac{a}{b}$ as the quantity formed by a parts of size $\\frac{1}{b}$."},"6.NS.C.7.c":{"t":"Understand the absolute value of a rational number as it…","g":"6","b":"g56","x":"Understand the absolute value of a rational number as its distance from 0 on the number line; interpret absolute value as magnitude for a positive or negative quantity in a real-world situation. *For example, for an account balance of -30 dollars, write |-30| = 30 to describe the size of the debt in dollars.*"},"2.OA.C.4":{"t":"Arrays as repeated addition","g":"2","b":"floor","x":"Use addition to find the total number of objects arranged in rectangular arrays with up to 5 rows and up to 5 columns; write an equation to express the total as a sum of equal addends."},"5.NF.B.3":{"t":"Fractions as division","g":"5","b":"g56","x":"Interpret a fraction as division of the numerator by the denominator ($\\frac{a}{b} = a \\div b$). Solve word problems involving division of whole numbers leading to answers in the form of fractions or mixed numbers, e.g., by using visual fraction models or equations to represent the problem. *For example, interpret $\\frac{3}{4}$ as the result of dividing 3 by 4, noting that $\\frac{3}{4}$ multiplied by 4 equals 3, and that when 3 wholes are shared equally among 4 people each person has a share of size $\\frac{3}{4}$. If 9 people want to share a 50-pound sack of rice equally by weight, how many pounds of rice should each person get? Between what two whole numbers does your answer lie?*"},"5.DL.A.4":{"t":"Compare data across samples","g":"5","b":"g56","x":"Using appropriate visualizations (i.e. double line plot, double bar graph), analyze data across samples."},"HSN-RN.A.2":{"t":"Radicals as exponents","g":"9","b":"hs","x":"Rewrite expressions involving radicals and rational exponents using the properties of exponents."},"7.G.A.2":{"t":"Construct triangles","g":"7","b":"g78","x":"Draw (freehand, with ruler and protractor, and with technology) geometric shapes with given conditions. Focus on constructing triangles from three measures of angles or sides, noticing when the conditions determine a unique triangle, more than one triangle, or no triangle."},"5.MD.A.1":{"t":"Convert among different-sized standard measurement units…","g":"5","b":"g56","x":"Convert among different-sized standard measurement units within a given measurement system (e.g., convert 5 cm to 0.05 m), and use these conversions in solving multi-step, real world problems."},"3.NBT.A.2":{"t":"Fluent +/− within 1000","g":"3","b":"floor","x":"Fluently add and subtract within 1000 using strategies and algorithms based on place value, properties of operations, and/or the relationship between addition and subtraction."},"8.EE.B.6":{"t":"Slope & y=mx+b","g":"8","b":"g78","x":"Use similar triangles to explain why the slope m is the same between any two distinct points on a non-vertical line in the coordinate plane; derive the equation y = mx for a line through the origin and the equation y = mx + b for a line intercepting the vertical axis at b."},"HSG-CO.A.2":{"t":"Transformations as functions","g":"9","b":"hs","x":"Represent transformations in the plane using, e.g., transparencies and geometry software; describe transformations as functions that take points in the plane as inputs and give other points as outputs. Compare transformations that preserve distance and angle to those that do not (e.g., translation versus horizontal stretch)."},"7.EE.B.3":{"t":"Multi-step rational problems","g":"7","b":"g78","x":"Solve multi-step real-life and mathematical problems posed with positive and negative rational numbers in any form (whole numbers, fractions, and decimals), using tools strategically. Apply properties of operations to calculate with numbers in any form; convert between forms as appropriate; and assess the reasonableness of answers using mental computation and estimation strategies. *For example: If a woman making $25 an hour gets a 10% raise, she will make an additional $\\frac{1}{10}$ of her salary an hour, or $2.50, for a new salary of $27.50. If you want to place a towel bar $9\\frac{3}{4}$ inches long in the center of a door that is $27\\frac{1}{2}$ inches wide, you will need to place the bar about 9 inches from each edge; this estimate can be used as a check on the exact computation.*"},"6.EE.B.7":{"t":"One-step equations","g":"6","b":"g56","x":"Solve real-world and mathematical problems by writing and solving equations of the form $x + p = q$ and $px = q$ for cases in which $p$, $q$ and $x$ are all nonnegative rational numbers."},"4.NF.C.6":{"t":"Fractions as decimals","g":"4","b":"floor","x":"Use decimal notation for fractions with denominators 10 or 100. *For example, rewrite 0.62 as $\\frac{62}{100}$; describe a length as 0.62 meters; locate 0.62 on a number line diagram.*"},"HSS-CP.A.2":{"t":"Independent events","g":"9","b":"hs","x":"Understand that two events A and B are independent if the probability of A and B occurring together is the product of their probabilities, and use this characterization to determine if they are independent."},"HSA-CED.A.4":{"t":"Rearrange formulas","g":"9","b":"hs","x":"Rearrange formulas to highlight a quantity of interest, using the same reasoning as in solving equations."},"8.G.A.2":{"t":"Congruence via motions","g":"8","b":"g78","x":"Understand that a two-dimensional figure is congruent to another if the second can be obtained from the first by a sequence of rotations, reflections, and translations; given two congruent figures, describe a sequence that exhibits the congruence between them."},"HSA-SSE.B.3.b":{"t":"Vertex by completing sq.","g":"9","b":"hs","x":"Complete the square in a quadratic expression to reveal the maximum or minimum value of the function it defines."},"HSA-APR.D.7":{"t":"Rational-expression ops","g":"9","b":"hs","x":"(+) Understand that rational expressions form a system analogous to the rational numbers, closed under addition, subtraction, multiplication, and division by a nonzero rational expression; add, subtract, multiply, and divide rational expressions."},"3.NF.A.2":{"t":"Fractions on a number line","g":"3","b":"floor","x":"Understand a fraction as a number on the number line; represent fractions on a number line diagram."},"7.RP.A.3":{"t":"Multistep percent problems","g":"7","b":"g78","x":"Use proportional relationships to solve multistep ratio and percent problems."},"4.NF.C.5":{"t":"Tenths & hundredths","g":"4","b":"floor","x":"Express a fraction with denominator 10 as an equivalent fraction with denominator 100, and use this technique to add two fractions with respective denominators 10 and 100."},"1.G.A.2":{"t":"Compose 2D & 3D shapes","g":"1","b":"floor","x":"Compose two-dimensional shapes (rectangles, squares, trapezoids, triangles, half-circles, and quarter-circles) or three-dimensional shapes (cubes, right rectangular prisms, right circular cones, and right circular cylinders) to create a composite shape, and compose new shapes from the composite shape."},"6.EE.A.4":{"t":"When expressions match","g":"6","b":"g56","x":"Identify when two expressions are equivalent (i.e., when the two expressions name the same number regardless of which value is substituted into them). *For example, the expressions y + y + y and 3y are equivalent because they name the same number regardless of which number y stands for.*"},"6.EE.A.2.a":{"t":"Write expressions that record operations with numbers an…","g":"6","b":"g56","x":"Write expressions that record operations with numbers and with letters standing for numbers. *For example, express the calculation \"Subtract y from 5\" as 5 - y.*"},"8.G.A.1.b":{"t":"*Verify experimentally the properties of rotations, refl…","g":"8","b":"g78","x":"*Verify experimentally the properties of rotations, reflections, and translations* angles are taken to angles of the same measure."},"HSF-IF.A.3":{"t":"Sequences are functions","g":"9","b":"hs","x":"Recognize that sequences are functions, sometimes defined recursively, whose domain is a subset of the integers."},"6.SP.B.5.a":{"t":"*Summarize numerical data sets in relation to their cont…","g":"6","b":"g56","x":"*Summarize numerical data sets in relation to their context, such as by* reporting the number of observations."},"4.NBT.A.1":{"t":"Each place is ×10","g":"4","b":"floor","x":"Recognize that in a multi-digit whole number, a digit in one place represents ten times what it represents in the place to its right. *For example, recognize that 700 ÷ 70 = 10 by applying concepts of place value and division.*"},"5.NF.B.7.b":{"t":"Interpret division of a whole number by a unit fraction,…","g":"5","b":"g56","x":"Interpret division of a whole number by a unit fraction, and compute such quotients. *For example, create a story context for $4 \\div (\\frac{1}{5})$, and use a visual fraction model to show the quotient. Use the relationship between multiplication and division to explain that $4 \\div (\\frac{1}{5}) = 20$ because $20 × (\\frac{1}{5}) = 4$.*"},"6.NS.C.7.a":{"t":"Interpret statements of inequality as statements about t…","g":"6","b":"g56","x":"Interpret statements of inequality as statements about the relative position of two numbers on a number line diagram. *For example, interpret -3 > -7 as a statement that -3 is located to the right of -7 on a number line oriented from left to right.*"},"7.NS.A.1.a":{"t":"Describe situations in which opposite quantities combine…","g":"7","b":"g78","x":"Describe situations in which opposite quantities combine to make 0. *For example, a hydrogen atom has 0 charge because its two constituents are oppositely charged.*"},"HSS-IC.A.1":{"t":"Inference from samples","g":"9","b":"hs","x":"Understand statistics as a process for making inferences about population parameters based on a random sample from that population."},"HSF-IF.C.8.b":{"t":"Growth vs decay rates","g":"9","b":"hs","x":"Use the properties of exponents to interpret expressions for exponential functions. *For example, identify percent rate of change in functions such as $y = (1.02)^{t}$, $y = (0.97)^{t}$, $y = (1.01)^{12t}$, $y = (1.2)^{\\frac{t}{10}}$, and classify them as representing exponential growth or decay.*"},"7.RP.A.2.c":{"t":"Represent proportional relationships by equations. *For…","g":"7","b":"g78","x":"Represent proportional relationships by equations. *For example, if total cost t is proportional to the number n of items purchased at a constant price p, the relationship between the total cost and the number of items can be expressed as t = pn.*"},"HSF-TF.A.2":{"t":"Unit circle","g":"9","b":"hs","x":"Explain how the unit circle in the coordinate plane enables the extension of trigonometric functions to all real numbers, interpreted as radian measures of angles traversed counterclockwise around the unit circle."},"HSS-ID.A.3":{"t":"Interpret shape & outliers","g":"9","b":"hs","x":"Interpret differences in shape, center, and spread in the context of the data sets, accounting for possible effects of extreme data points (outliers)."},"6.EE.B.5":{"t":"What a solution is","g":"6","b":"g56","x":"Understand solving an equation or inequality as a process of answering a question: which values from a specified set, if any, make the equation or inequality true? Use substitution to determine whether a given number in a specified set makes an equation or inequality true."},"7.EE.B.4.b":{"t":"Solve word problems leading to inequalities of the form…","g":"7","b":"g78","x":"Solve word problems leading to inequalities of the form px + q > r or px + q < r, where p, q, and r are specific rational numbers. Graph the solution set of the inequality and interpret it in the context of the problem. *For example: As a salesperson, you are paid $50 per week plus $3 per sale. This week you want your pay to be at least $100. Write an inequality for the number of sales you need to make, and describe the solutions.*"},"6.EE.A.1":{"t":"Whole-number exponents","g":"6","b":"g56","x":"Write and evaluate numerical expressions involving whole-number exponents."},"HSN-CN.A.1":{"t":"The number i","g":"9","b":"hs","x":"Know there is a complex number $i$ such that $i^2 = -1$, and every complex number has the form $a + bi$ with $a$ and $b$ real."},"8.F.B.4":{"t":"Model with linear functions","g":"8","b":"g78","x":"Construct a function to model a linear relationship between two quantities. Determine the rate of change and initial value of the function from a description of a relationship or from two (x, y) values, including reading these from a table or from a graph. Interpret the rate of change and initial value of a linear function in terms of the situation it models, and in terms of its graph or a table of values."},"6.SP.A.1":{"t":"Statistical questions","g":"6","b":"g56","x":"Recognize a statistical question as one that anticipates variability in the data related to the question and accounts for it in the answers. *For example, \"How old am I?\" is not a statistical question, but \"How old are the students in my school?\" is a statistical question because one anticipates variability in students' ages.*"},"7.RP.A.2.d":{"t":"Explain what a point (x, y) on the graph of a proportion…","g":"7","b":"g78","x":"Explain what a point (x, y) on the graph of a proportional relationship means in terms of the situation, with special attention to the points (0, 0) and (1, r) where r is the unit rate."},"8.EE.A.2":{"t":"Square & cube roots","g":"8","b":"g78","x":"Use square root and cube root symbols to represent solutions to equations of the form $x^{2} = p$ and $x^3 = p$, where $p$ is a positive rational number. Evaluate square roots of small perfect squares and cube roots of small perfect cubes. Know that $\\sqrt{2}$ is irrational."},"3.OA.A.2":{"t":"What division means","g":"3","b":"floor","x":"Interpret whole-number quotients of whole numbers, e.g., interpret $56 \\div 8$ as the number of objects in each share when 56 objects are partitioned equally into 8 shares, or as a number of shares when 56 objects are partitioned into equal shares of 8 objects each. *For example, describe a context in which a number of shares or a number of groups can be expressed as $56 \\div 8$.*"},"HSA-REI.C.7":{"t":"Linear-quadratic systems","g":"9","b":"hs","x":"Solve a simple system consisting of a linear equation and a quadratic equation in two var
