iables algebraically and graphically. *For example, find the points of intersection between the line $y = -3x$ and the circle $x^{2} + y^{2} = 3$.*"},"8.G.A.1.a":{"t":"*Verify experimentally the properties of rotations, refl…","g":"8","b":"g78","x":"*Verify experimentally the properties of rotations, reflections, and translations:* lines are taken to lines, and line segments to line segments of the same length."},"3.NBT.A.3":{"t":"Multiply by tens","g":"3","b":"floor","x":"Multiply one-digit whole numbers by multiples of 10 in the range 10—90 (e.g., $9 \\times 80$, $5 \\times 60$) using strategies based on place value and properties of operations."},"2.OA.C.3":{"t":"Odd & even","g":"2","b":"floor","x":"Determine whether a group of objects (up to 20) has an odd or even number of members, e.g., by pairing objects or counting them by 2s; write an equation to express an even number as a sum of two equal addends."},"4.OA.A.3":{"t":"Multi-step word problems","g":"4","b":"floor","x":"Solve multistep word problems posed with whole numbers and having whole-number answers using the four operations, including problems in which remainders must be interpreted. Represent these problems using equations with a letter standing for the unknown quantity. Assess the reasonableness of answers using mental computation and estimation strategies including rounding."},"3.OA.A.1":{"t":"What multiplication means","g":"3","b":"floor","x":"Interpret products of whole numbers, e.g., interpret $5 \\times 7$ as the total number of objects in 5 groups of 7 objects each. *For example, describe a context in which a total number of objects can be expressed as $5 \\div 7$.*"},"8.EE.C.8.c":{"t":"Solve real-world and mathematical problems leading to tw…","g":"8","b":"g78","x":"Solve real-world and mathematical problems leading to two linear equations in two variables. *For example, given coordinates for two pairs of points, determine whether the line through the first pair of points intersects the line through the second pair.*"},"8.F.A.1":{"t":"What a function is","g":"8","b":"g78","x":"Understand that a function is a rule that assigns to each input exactly one output. The graph of a function is the set of ordered pairs consisting of an input and the corresponding output."},"HSG-SRT.A.1":{"t":"Dilation properties","g":"9","b":"hs","x":"Verify experimentally the properties of dilations given by a center and a scale factor:"},"4.NF.B.4.a":{"t":"Understand a fraction $\\frac{a}{b}$ as a multiple of $\\f…","g":"4","b":"floor","x":"Understand a fraction $\\frac{a}{b}$ as a multiple of $\\frac{1}{b}$. *For example, use a visual fraction model to represent $\\frac{5}{4}$ as the product $5 \\times (\\frac{1}{4})$, recording the conclusion by the equation $\\frac{5}{4} = 5 \\times (\\frac{1}{4})$.*"},"HSF-TF.C.8":{"t":"Pythagorean identity","g":"9","b":"hs","x":"Prove the Pythagorean identity $\\sin^{2}(\\theta) + \\cos^{2}(\\theta) = 1$ and use it to find $\\sin(\\theta)$, $\\cos(\\theta)$, or $\\tan(\\theta)$ given $\\sin(\\theta)$, $\\cos(\\theta)$, or $\\tan(\\theta)$ and the quadrant of the angle."},"6.NS.B.3":{"t":"Decimal-operations fluency","g":"6","b":"g56","x":"Fluently add, subtract, multiply, and divide multi-digit decimals using the standard algorithm for each operation."},"7.EE.B.4.a":{"t":"Solve word problems leading to equations of the form px…","g":"7","b":"g78","x":"Solve word problems leading to equations of the form px + q = r and p(x + q) = r, where p, q, and r are specific rational numbers. Solve equations of these forms fluently. Compare an algebraic solution to an arithmetic solution, identifying the sequence of the operations used in each approach. *For example, the perimeter of a rectangle is 54 cm. Its length is 6 cm. What is its width?*"},"4.NF.B.4.c":{"t":"Solve word problems involving multiplication of a fracti…","g":"4","b":"floor","x":"Solve word problems involving multiplication of a fraction by a whole number, e.g., by using visual fraction models and equations to represent the problem. *For example, if each person at a party will eat 3/8 of a pound of roast beef, and there will be 5 people at the party, how many pounds of roast beef will be needed? Between what two whole numbers does your answer lie?*"},"HSF-IF.C.7.c":{"t":"Graph polynomials","g":"9","b":"hs","x":"Graph polynomial functions, identifying zeros when suitable factorizations are available, and showing end behavior."},"6.EE.B.6":{"t":"Variables for unknowns","g":"6","b":"g56","x":"Use variables to represent numbers and write expressions when solving a real-world or mathematical problem; understand that a variable can represent an unknown number, or, depending on the purpose at hand, any number in a specified set."},"HSA-SSE.B.3.a":{"t":"Factor to find zeros","g":"9","b":"hs","x":"Factor a quadratic expression to reveal the zeros of the function it defines."},"HSS-CP.A.4":{"t":"Two-way tables (prob)","g":"9","b":"hs","x":"Construct and interpret two-way frequency tables of data when two categories are associated with each object being classified. Use the two-way table as a sample space to decide if events are independent and to approximate conditional probabilities."},"8.NS.A.1":{"t":"Rational or irrational?","g":"8","b":"g78","x":"Know that numbers that are not rational are called irrational. Understand informally that every number has a decimal expansion; for rational numbers show that the decimal expansion repeats eventually, and convert a decimal expansion which repeats eventually into a rational number."},"2.OA.A.1":{"t":"Add/sub word problems","g":"2","b":"floor","x":"Use addition and subtraction within 100 to solve one- and two-step word problems involving situations of adding to, taking from, putting together, taking apart, and comparing, with unknowns in all positions, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem."},"HSA-APR.D.6":{"t":"Rewrite rational expressions","g":"9","b":"hs","x":"Rewrite simple rational expressions in different forms; write $\\frac{a(x)}{b(x)}$ in the form $q(x) + \\frac{r(x)}{b(x)}$, where $a(x)$, $b(x)$, $q(x)$, and $r(x)$ are polynomials with the degree of $r(x)$ less than the degree of $b(x)$, using inspection, long division, or, for the more complicated examples, a computer algebra system."},"8.SP.A.4":{"t":"Two-way tables","g":"8","b":"g78","x":"Understand that patterns of association can also be seen in bivariate categorical data by displaying frequencies and relative frequencies in a two-way table. Construct and interpret a two-way table summarizing data on two categorical variables collected from the same subjects. Use relative frequencies calculated for rows or columns to describe possible association between the two variables. *For example, collect data from students in your class on whether or not they have a curfew on school nights and whether or not they have assigned chores at home. Is there evidence that those who have a curfew also tend to have chores?*"},"HSG-SRT.B.4":{"t":"Similarity proofs","g":"9","b":"hs","x":"Prove theorems about triangles."},"8.G.C.9":{"t":"Cones, cylinders, spheres","g":"8","b":"g78","x":"Know the formulas for the volumes of cones, cylinders, and spheres and use them to solve real-world and mathematical problems."},"4.NF.C.7":{"t":"Compare decimals","g":"4","b":"floor","x":"Compare two decimals to hundredths by reasoning about their size. Recognize that comparisons are valid only when the two decimals refer to the same whole. Record the results of comparisons with the symbols >, =, or <, and justify the conclusions, e.g., by using a visual model."},"6.RP.A.3.d":{"t":"Use ratio reasoning to convert measurement units; manipu…","g":"6","b":"g56","x":"Use ratio reasoning to convert measurement units; manipulate and transform units appropriately when multiplying or dividing quantities."},"HSA-REI.B.4.a":{"t":"Complete the square","g":"9","b":"hs","x":"Use the method of completing the square to transform any quadratic equation in x into an equation of the form $(x - p)^{2} = q$ that has the same solutions. Derive the quadratic formula from this form."},"5.NBT.A.4":{"t":"Round decimals","g":"5","b":"g56","x":"Use place value understanding to round decimals to any place."},"HSF-TF.A.3":{"t":"Special angle values","g":"9","b":"hs","x":"(+) Use special triangles to determine geometrically the values of sine, cosine, tangent for $\\frac{\\pi}{3}$, $\\frac{\\pi}{4}$ and $\\frac{\\pi}{6}$, and use the unit circle to express the values of sine, cosine, and tangent for $\\pi-x$, $\\pi+x$, and $2\\pi-x$ in terms of their values for x, where x is any real number."},"HSG-GPE.A.1":{"t":"Circle equations","g":"9","b":"hs","x":"Derive the equation of a circle of given center and radius using the Pythagorean Theorem; complete the square to find the center and radius of a circle given by an equation."},"HSA-SSE.B.3.c":{"t":"Rewrite exponential exprs","g":"9","b":"hs","x":"Use the properties of exponents to transform expressions for exponential functions."},"HSG-CO.B.6":{"t":"Rigid motion ⇒ congruent","g":"9","b":"hs","x":"Use geometric descriptions of rigid motions to transform figures and to predict the effect of a given rigid motion on a given figure; given two figures, use the definition of congruence in terms of rigid motions to decide if they are congruent."},"HSG-GMD.A.2":{"t":"Cavalieri's principle","g":"9","b":"hs","x":"(+) Give an informal argument using Cavalieri's principle for the formulas for the volume of a sphere and other solid figures."},"HSA-REI.D.12":{"t":"Graph inequality regions","g":"9","b":"hs","x":"Graph the solutions to a linear inequality in two variables as a half-plane (excluding the boundary in the case of a strict inequality), and graph the solution set to a system of linear inequalities in two variables as the intersection of the corresponding half-planes."},"4.G.A.2":{"t":"Classify 2D shapes","g":"4","b":"floor","x":"Classify two-dimensional figures based on the presence or absence of parallel or perpendicular lines, or the presence or absence of angles of a specified size. Recognize right triangles as a category, and identify right triangles."},"4.NF.B.3.c":{"t":"Add and subtract mixed numbers with like denominators, e…","g":"4","b":"floor","x":"Add and subtract mixed numbers with like denominators, e.g., by replacing each mixed number with an equivalent fraction, and/or by using properties of operations and the relationship between addition and subtraction."},"HSA-APR.C.5":{"t":"Binomial theorem","g":"9","b":"hs","x":"(+) Know and apply the Binomial Theorem for the expansion of $(x + y)^{n}$ in powers of x and y for a positive integer n, where x and y are any numbers, with coefficients determined for example by Pascal's Triangle."},"HSG-SRT.B.5":{"t":"Apply congruence/similarity","g":"9","b":"hs","x":"Use congruence and similarity criteria for triangles to solve problems and to prove relationships in geometric figures."},"HSG-CO.D.12":{"t":"Compass constructions","g":"9","b":"hs","x":"Make formal geometric constructions with a variety of tools and methods (compass and straightedge, string, reflective devices, paper folding, dynamic geometric software, etc.). Copying a segment; copying an angle; bisecting a segment; bisecting an angle; constructing perpendicular lines, including the perpendicular bisector of a line segment; and constructing a line parallel to a given line through a point not on the line."},"8.SP.A.1":{"t":"Scatter plots","g":"8","b":"g78","x":"Construct and interpret scatter plots for bivariate measurement data to investigate patterns of association between two quantities. Describe patterns such as clustering, outliers, positive or negative association, linear association, and nonlinear association."},"HSA-REI.B.4.b":{"t":"Solve quadratics","g":"9","b":"hs","x":"Solve quadratic equations by inspection (e.g., for $x^{2} = 49$), taking square roots, completing the square, the quadratic formula and factoring, as appropriate to the initial form of the equation. Recognize when the quadratic formula gives complex solutions and write them as a ± bi for real numbers a and b."},"HSA-REI.C.5":{"t":"Why elimination works","g":"9","b":"hs","x":"Prove that, given a system of two equations in two variables, replacing one equation by the sum of that equation and a multiple of the other produces a system with the same solutions."},"5.NBT.B.6":{"t":"Divide by two digits","g":"5","b":"g56","x":"Find whole-number quotients of whole numbers with up to four-digit dividends and two-digit divisors, using strategies based on place value, the properties of operations, and/or the relationship between multiplication and division. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models."},"6.EE.A.3":{"t":"Make equivalent expressions","g":"6","b":"g56","x":"Apply the properties of operations to generate equivalent expressions. *For example, apply the distributive property to the expression $3(2 + x)$ to produce the equivalent expression 6 + 3x; apply the distributive property to the expression 24x + 18y to produce the equivalent expression $6(4x + 3y)$; apply properties of operations to y + y + y to produce the equivalent expression 3y.*"},"4.NF.B.3.d":{"t":"Solve word problems involving addition and subtraction o…","g":"4","b":"floor","x":"Solve word problems involving addition and subtraction of fractions referring to the same whole and having like denominators, e.g., by using visual fraction models and equations to represent the problem."},"HSS-ID.A.4":{"t":"Normal distribution","g":"9","b":"hs","x":"Use the mean and standard deviation of a data set to fit it to a normal distribution and to estimate population percentages. Recognize that there are data sets for which such a procedure is not appropriate. Use calculators, spreadsheets, and tables to estimate areas under the normal curve."},"HSA-REI.B.3":{"t":"Linear eqs & inequalities","g":"9","b":"hs","x":"Solve linear equations and inequalities in one variable, including equations with coefficients represented by letters."},"HSF-IF.A.2":{"t":"Evaluate f(x)","g":"9","b":"hs","x":"Use function notation, evaluate functions for inputs in their domains, and interpret statements that use function notation in terms of a context."},"2.NBT.A.1":{"t":"Hundreds, tens, ones","g":"2","b":"floor","x":"Understand that the three digits of a three-digit number represent amounts of hundreds, tens, and ones; e.g., 706 equals 7 hundreds, 0 tens, and 6 ones. Understand the following as special cases:"},"5.G.A.1":{"t":"The coordinate plane","g":"5","b":"g56","x":"Use a pair of perpendicular number lines, called axes, to define a coordinate system, with the intersection of the lines (the origin) arranged to coincide with the 0 on each line and a given point in the plane located by using an ordered pair of numbers, called its coordinates. Understand that the first number indicates how far to travel from the origin in the direction of one axis, and the second number indicates how far to travel in the direction of the second axis, with the convention that the names of the two axes and the coordinates correspond (e.g., x-axis and x-coordinate, y-axis and y-coordinate)."},"3.MD.D.8":{"t":"Perimeter","g":"3","b":"floor","x":"Solve real world and mathematical problems involving perimeters of polygons, including finding the perimeter given the side lengths, finding an unknown side length, and exhibiting rectangles with the same perimeter and different areas or with the same area and different perimeters."},"HSG-SRT.C.7":{"t":"sin(θ)=cos(90−θ)","g":"9","b":"hs","x":"Explain and use the relationship between the sine and cosine of complementary angles."},"HSA-SSE.A.1":{"t":"Interpret expression parts","g":"9","b":"hs","x":"Interpret expressions that represent a quantity in terms of its context"},"7.SP.C.7.a":{"t":"Develop a uniform probability model by assigning equal p…","g":"7","b":"g78","x":"Develop a uniform probability model by assigning equal probability to all outcomes, and use the model to determine probabilities of events. *For example, if a student is selected at random from a class, find the probability that Jane will be selected and the probability that a girl will be selected.*"},"8.NS.A.2":{"t":"Estimate √2 etc.","g":"8","b":"g78","x":"Use rational approximations of irrational numbers to compare the size of irrational numbers, locate them approximately on a number line diagram, and estimate the value of expressions (e.g., ${\\pi}^{2}$). *For example, by truncating the decimal expansion of $\\sqrt{2}$, show that $\\sqrt{2}$ is between 1 and 2, then between 1.4 and 1.5, and explain how to continue on to get better approximations.*"},"8.EE.A.1":{"t":"Integer exponent laws","g":"8","b":"g78","x":"Know and apply the properties of integer exponents to generate equivalent numerical expressions. *For example, $3^{2} \\times 3^{-5} = 3^{-3} = {{\\frac{1}{3}}^3} = {\\frac{1}{27}}$.*"},"HSG-SRT.D.9":{"t":"Area = ½ab·sin(C)","g":"9","b":"hs","x":"(+) Derive the formula $A = \\frac{1}{2} ab \\sin(C)$ for the area of a triangle by drawing an auxiliary line from a vertex perpendicular to the opposite side."},"8.G.A.3":{"t":"Transform with coordinates","g":"8","b":"g78","x":"Describe the effect of dilations, translations, rotations, and reflections on two-dimensional figures using coordinates."},"4.NBT.B.6":{"t":"Divide by one digit","g":"4","b":"floor","x":"Find whole-number quotients and remainders with up to four-digit dividends and one-digit divisors, using strategies based on place value, the properties of operations, and/or the relationship between multiplication and division. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models."},"HSF-BF.B.5":{"t":"Logs undo exponentials","g":"9","b":"hs","x":"(+) Understand the inverse relationship between exponents and logarithms and use this relationship to solve problems involving logarithms and exponents."},"3.NBT.A.1":{"t":"Round to 10s & 100s","g":"3","b":"floor","x":"Use place value understanding to round whole numbers to the nearest 10 or 100."},"HSN-RN.A.1":{"t":"Meaning of x^(1/2)","g":"9","b":"hs","x":"Explain how the definition of the meaning of rational exponents follows from extending the properties of integer exponents to those values, allowing for a notation for radicals in terms of rational exponents."},"HSG-C.B.5":{"t":"Arcs, sectors, radians","g":"9","b":"hs","x":"Derive using similarity the fact that the length of the arc intercepted by an angle is proportional to the radius, and define the radian measure of the angle as the constant of proportionality; derive the formula for the area of a sector."},"3.MD.C.5":{"t":"Area as unit squares","g":"3","b":"floor","x":"Recognize area as an attribute of plane figures and understand concepts of area measurement."},"3.NF.A.3":{"t":"Equivalent fractions (intro)","g":"3","b":"floor","x":"Explain equivalence of fractions in special cases, and compare fractions by reasoning about their size."},"HSF-IF.B.5":{"t":"Domain fits context","g":"9","b":"hs","x":"Relate the domain of a function to its graph and, where applicable, to the quantitative relationship it describes."},"8.EE.C.7.a":{"t":"Give examples of linear equations in one variable with o…","g":"8","b":"g78","x":"Give examples of linear equations in one variable with one solution, infinitely many solutions, or no solutions. Show which of these possibilities is the case by successively transforming the given equation into simpler forms, until an equivalent equation of the form x = a, a = a, or a = b results (where a and b are different numbers)."},"HSS-ID.C.9":{"t":"Correlation ≠ causation","g":"9","b":"hs","x":"Distinguish between correlation and causation."},"7.NS.A.1.b":{"t":"Understand p + q as the number located a distance |q| fr…","g":"7","b":"g78","x":"Understand p + q as the number located a distance |q| from p, in the positive or negative direction depending on whether q is positive or negative. Show that a number and its opposite have a sum of 0 (are additive inverses). Interpret sums of rational numbers by describing real-world contexts."},"5.OA.A.2":{"t":"Write & interpret expressions","g":"5","b":"g56","x":"Write simple expressions that record calculations with numbers, and interpret numerical expressions without evaluating them. *For example, express the calculation \"add 8 and 7, then multiply by 2\" as $2 \\times (8 + 7)$. Recognize that $3 \\times (18932 + 921)$ is three times as large as 18932 + 921, without having to calculate the indicated sum or product.*"},"3.G.A.1":{"t":"Shape categories","g":"3","b":"floor","x":"Understand that shapes in different categories (e.g., rhombuses, rectangles, and others) may share attributes (e.g., having four sides), and that the shared attributes can define a larger category (e.g., quadrilaterals). Recognize rhombuses, rectangles, and squares as examples of quadrilaterals, and draw examples of quadrilaterals that do not belong to any of these subcategories."},"6.SP.B.4":{"t":"Plot data distributions","g":"6","b":"g56","x":"Display numerical data in plots on a number line, including dot plots, histograms, and box plots."},"4.NBT.B.4":{"t":"Fluent multi-digit + / −","g":"4","b":"floor","x":"Fluently add and subtract multi-digit whole numbers using the standard algorithm."},"HSN-RN.B.3":{"t":"Rational + irrational = ?","g":"9","b":"hs","x":"Explain why the sum or product of two rational numbers is rational; that the sum of a rational number and an irrational number is irrational; and that the product of a nonzero rational number and an irrational number is irrational."},"7.NS.A.3":{"t":"All four ops with rationals","g":"7","b":"g78","x":"Solve real-world and mathematical problems involving the four operations with rational numbers."},"HSG-CO.A.5":{"t":"Carry out transformations","g":"9","b":"hs","x":"Given a geometric figure and a rotation, reflection, or translation, draw the transformed figure using, e.g., graph paper, tracing paper, or geometry software. Specify a sequence of transformations that will carry a given figure onto another."},"6.NS.C.5":{"t":"Positive & negative numbers","g":"6","b":"g56","x":"Understand that positive and negative numbers are used together to describe quantities having opposite directions or values (e.g., temperature above/below zero, elevation above/below sea level, credits/debits, positive/negative electric charge); use positive and negative numbers to represent quantities in real-world contexts, explaining the meaning of 0 in each situation."},"6.SP.A.3":{"t":"Center vs variability","g":"6","b":"g56","x":"Recognize that a measure of center for a numerical data set summarizes all of its values with a single number, while a measure of variation describes how its values vary with a single number."},"4.MD.C.6":{"t":"Measure angles (protractor)","g":"4","b":"floor","x":"Measure angles in whole-number degrees using a protractor. Sketch angles of specified measure."},"6.EE.C.9":{"t":"Two variables, one rule","g":"6","b":"g56","x":"Use variables to represent two quantities in a real-world problem that change in relationship to one another; write an equation to express one quantity, thought of as the dependent variable, in terms of the other quantity, thought of as the independent variable. Analyze the relationship between the dependent and independent variables using graphs and tables, and relate these to the equation. *For example, in a problem involving motion at constant speed, list and graph ordered pairs of distances and times, and write the equation d = 65t to represent the relationship between distance and time.*"},"7.G.B.4":{"t":"Circles: C & A","g":"7","b":"g78","x":"Know the formulas for the area and circumference of a circle and use them to solve problems; give an informal derivation of the relationship between the circumference and area of a circle."},"7.G.A.1":{"t":"Scale drawings","g":"7","b":"g78","x":"Solve problems involving scale drawings of geometric figures, including computing actual lengths and areas from a scale drawing and reproducing a scale drawing at a different scale."},"HSA-REI.A.2":{"t":"Solve radical equations","g":"9","b":"hs","x":"Solve simple rational and radical equations in one variable, and give examples showing how extraneous solutions may arise."},"6.NS.C.6.a":{"t":"Recognize opposite signs of numbers as indicating locati…","g":"6","b":"g56","x":"Recognize opposite signs of numbers as indicating locations on opposite sides of 0 on the number line; recognize that the opposite of the opposite of a number is the number itself, e.g., -(-3) = 3, and that 0 is its own opposite."},"HSF-BF.A.2":{"t":"Write sequences","g":"9","b":"hs","x":"Write arithmetic and geometric sequences both recursively and with an explicit formula, use them to model situations, and translate between the two forms."},"HSG-GPE.B.7":{"t":"Area via coordinates","g":"9","b":"hs","x":"Use coordinates to compute perimeters of polygons and areas of triangles and rectangles, e.g., using the distance formula."},"4.OA.C.5":{"t":"Generate patterns","g":"4","b":"floor","x":"Generate a number or shape pattern that follows a given rule. Identify apparent features of the pattern that were not explicit in the rule itself. *For example, given the rule \"Add 3\" and the starting number 1, generate terms in the resulting sequence and observe that the terms appear to alternate between odd and even numbers. Explain informally why the numbers will continue to alternate in this way.*"},"5.NBT.A.2":{"t":"Multiply by powers of 10","g":"5","b":"g56","x":"Explain patterns in the number of zeros of the product when multiplying a number by powers of 10, and explain patterns in the placement of the decimal point when a decimal is multiplied or divided by a power of 10. Use whole-number exponents to denote powers of 10."},"4.NF.A.2":{"t":"Compare fractions","g":"4","b":"floor","x":"Compare two fractions with different numerators and different denominators, e.g., by creating common denominators or numerators, or by comparing to a benchmark fraction such as $\\frac{1}{2}$. Recognize that comparisons are valid only when the two fractions refer to the same whole. Record the results of comparisons with symbols >, =, or <, and justify the conclusions, e.g., by using a visual fraction model."},"HSG-GPE.B.4":{"t":"Coordinate proofs","g":"9","b":"hs","x":"Use coordinates to prove simple geometric theorems algebraically. *For example, prove or disprove that a figure defined by four given points in the coordinate plane is a rectangle; prove or disprove that the point $(1, \\sqrt{3})$ lies on the circle centered at the origin and containing the point (0, 2).*"},"6.SP.B.5.d":{"t":"*Summarize numerical data sets in relation to their cont…","g":"6","b":"g56","x":"*Summarize numerical data sets in relation to their context, such as by* relating the choice of measures of center and variability to the shape of the data distribution and the context in which the data were gathered."},"7.RP.A.2.b":{"t":"Identify the constant of proportionality (unit rate) in…","g":"7","b":"g78","x":"Identify the constant of proportionality (unit rate) in tables, graphs, equations, diagrams, and verbal descriptions of proportional relationships."},"7.NS.A.1.d":{"t":"Apply properties of operations as strategies to add and…","g":"7","b":"g78","x":"Apply properties of operations as strategies to add and subtract rational numbers."},"3.MD.A.2":{"t":"Measure mass & liquid","g":"3","b":"floor","x":"Measure and estimate liquid volumes and masses of objects using standard units of grams (g), kilograms (kg), and liters (l). Add, subtract, multiply, or divide to solve one-step word problems involving masses or volumes that are given in the same units, e.g., by using drawings (such as a beaker with a measurement scale) to represent the problem."},"8.SP.A.3":{"t":"Read the fitted line","g":"8","b":"g78","x":"Use the equation of a linear model to solve problems in the context of bivariate measurement data, interpreting the slope and intercept. *For example, in a linear model for a biology experiment, interpret a slope of 1.5 cm/hr as meaning that an additional hour of sunlight each day is associated with an additional 1.5 cm in mature plant height.*"},"6.EE.A.2.c":{"t":"Evaluate expressions at specific values of their variabl…","g":"6","b":"g56","x":"Evaluate expressions at specific values of their variables. Include expressions that arise from formulas used in real-world problems. Perform arithmetic operations, including those involving whole-number exponents, in the conventional order when there are no parentheses to specify a particular order (Order of Operations). *For example, use the formulas $V = s^{3}$ and $A = 6 s^2$ to find the volume and surface area of a cube with sides of length $s = \\frac{1}{2}$.*"},"HSN-CN.A.2":{"t":"Complex arithmetic","g":"9","b":"hs","x":"Use the relation $i^2 = -1$ and the commutative, associative, and distributive properties to add, subtract, and multiply complex numbers."},"2.NBT.B.8":{"t":"Mental +10 / +100","g":"2","b":"floor","x":"Mentally add 10 or 100 to a given number 100—900, and mentally subtract 10 or 100 from a given number 100—900."},"4.G.A.1":{"t":"Lines, angles, rays","g":"4","b":"floor","x":"Draw points, lines, line segments, rays, angles (right, acute, obtuse), and perpendicular and parallel lines. Identify these in two-dimensional figures."},"8.G.A.1.c":{"t":"*Verify experimentally the properties of rotations, refl…","g":"8","b":"g78","x":"*Verify experimentally the properties of rotations, reflections, and translations* parallel lines are taken to parallel lines."},"HSS-IC.A.2":{"t":"Test models by simulation","g":"9","b":"hs","x":"Decide if a specified model is consistent with results from a given data-generating process, e.g., using simulation. *For example, a model says a spinning coin falls heads up with probability 0.5. Would a result of 5 tails in a row cause you to question the model?*"},"8.EE.C.8.a":{"t":"Understand that solutions to a system of two linear equa…","g":"8","b":"g78","x":"Understand that solutions to a system of two linear equations in two variables correspond to points of intersection of their graphs, because points of intersection satisfy both equations simultaneously."},"7.NS.A.1.c":{"t":"Understand subtraction of rational numbers as adding the…","g":"7","b":"g78","x":"Understand subtraction of rational numbers as adding the additive inverse, p - q = p + (-q). Show that the distance between two rational numbers on the number line is the absolute value of their difference, and apply this principle in real-world contexts."},"5.NF.B.7.a":{"t":"Interpret division of a unit fraction by a non-zero whol…","g":"5","b":"g56","x":"Interpret division of a unit fraction by a non-zero whole number, and compute such quotients. *For example, create a story context for $(\\frac{1}{3}) \\div 4$, and use a visual fraction model to show the quotient. Use the relationship between multiplication and division to explain that $(\\frac{1}{3}) \\div 4 = \\frac{1}{12}$ because $(\\frac{1}{12}) \\times 4 = \\frac{1}{3}$.*"},"5.NBT.A.3.a":{"t":"Read and write decimals to thousandths using base-ten nu…","g":"5","b":"g56","x":"Read and write decimals to thousandths using base-ten numerals, number names, and expanded form, e.g., $347.392 = 3 \\times 100 + 4 \\times 10 + 7 \\times 1 + 3 \\times (\\frac{1}{10}) + 9 \\times (\\frac{1}{100}) + 2 \\times (\\frac{1}{1000})$."},"3.OA.D.9":{"t":"Arithmetic patterns","g":"3","b":"floor","x":"Identify arithmetic patterns (including patterns in the addition table or multiplication table), and explain them using properties of operations. *For example, observe that 4 times a number is always even, and explain why 4 times a number can be decomposed into two equal addends.*"},"7.NS.A.2.d":{"t":"Convert a rational number to a decimal using long divisi…","g":"7","b":"g78","x":"Convert a rational number to a decimal using long division; know that the decimal form of a rational number terminates in 0s or eventually repeats."},"3.OA.B.6":{"t":"Division as missing factor","g":"3","b":"floor","x":"Understand division as an unknown-factor problem. *For example, find $32 \\div 8$ by finding the number that makes 32 when multiplied by 8.*"},"HSG-CO.C.9":{"t":"Prove line/angle theorems","g":"9","b":"hs","x":"Prove theorems about lines and angles."},"5.DL.A.1":{"t":"Interpret data displays","g":"5","b":"g56","x":"Understand how different visualizations can highlight different aspects of data. Ask questions and interpret data visualizations to describe and analyze patterns."},"HSN-CN.C.8":{"t":"Complex factoring","g":"9","b":"hs","x":"(+) Extend polynomial identities to the complex numbers. *For example, rewrite $x^{2} + 4$ as $(x + 2i)(x - 2i)$.*"},"7.NS.A.2.b":{"t":"Understand that integers can be divided, provided that t…","g":"7","b":"g78","x":"Understand that integers can be divided, provided that the divisor is not zero, and every quotient of integers (with non-zero divisor) is a rational number. If $p$ and $q$ are integers, then $-(\\frac{p}{q}) = \\frac{(-p)}{q} = \\frac{p}{(-q)}$. Interpret quotients of rational numbers by describing real-world contexts."},"6.NS.C.6.c":{"t":"Find and position integers and other rational numbers on…","g":"6","b":"g56","x":"Find and position integers and other rational numbers on a horizontal or vertical number line diagram; find and position pairs of integers and other rational numbers on a coordinate plane."},"2.MD.A.1":{"t":"Measure lengths with tools","g":"2","b":"floor","x":"Measure the length of an object by selecting and using appropriate tools such as rulers, yardsticks, meter sticks, and measuring tapes."},"4.MD.C.7":{"t":"Angles add up","g":"4","b":"floor","x":"Recognize angle measure as additive. When an angle is decomposed into non-overlapping parts, the angle measure of the whole is the sum of the angle measures of the parts. Solve addition and subtraction problems to find unknown angles on a diagram in real world and mathematical problems, e.g., by using an equation with a symbol for the unknown angle measure."},"HSG-CO.A.4":{"t":"Define rigid motions","g":"9","b":"hs","x":"Develop definitions of rotations, reflections, and translations in terms of angles, circles, perpendicular lines, parallel lines, and line segments."},"5.NBT.B.5":{"t":"Fluent multiplication","g":"5","b":"g56","x":"Fluently multiply multi-digit whole numbers using the standard algorithm."},"6.G.A.1":{"t":"Area of any polygon","g":"6","b":"g56","x":"Find the area of right triangles, other triangles, special quadrilaterals, and polygons by composing into rectangles or decomposing into triangles and other shapes; apply these techniques in the context of solving real-world and mathematical problems."},"8.F.A.3":{"t":"Linear vs not","g":"8","b":"g78","x":"Interpret the equation y = mx + b as defining a linear function, whose graph is a straight line; give examples of functions that are not linear. *For example, the function $A = s^{2}$ giving the area of a square as a function of its side length is not linear because its graph contains the points (1,1), (2,4) and (3,9), which are not on a straight line.*"},"5.NF.B.5.b":{"t":"*Interpret multiplication as scaling (resizing), by* exp…","g":"5","b":"g56","x":"*Interpret multiplication as scaling (resizing), by* explaining why multiplying a given number by a fraction greater than 1 results in a product greater than the given number (recognizing multiplication by whole numbers greater than 1 as a familiar case); explaining why multiplying a given number by a fraction less than 1 results in a product smaller than the given number; and relating the principle of fraction equivalence $\\frac{a}{b} = \\frac{(n \\times a)}{(n \\times b)}$ nt expressions (6.EE.A.4) is the grade-6 basis for 7.EE.A.2. High confidence.</span>","6.G.A.4|7.G.A.3":"Nets / surface area build the 3-D visualization for cross-sections.<span class=\"tipcite\">CCSS-M Progressions (2023), K–6 & 7–8 Geometry — reasoning about 3-D figures via nets (6.G.A.4) precedes slicing them into cross-sections (7.G.A.3). Moderate confidence.</span>","5.MD.C.3|7.G.A.3":"Understanding solids as an attribute before slicing them.<span class=\"tipcite\">CCSS-M Progressions (2023), K–5 Geometric Measurement — volume/attributes of solids (5.MD.C) as earlier 3-D reasoning. Moderate confidence.</span>","7.NS.A.2.a|7.NS.A.2.b":"Integer multiplication extended before integer division (same cluster).<span class=\"tipcite\">CCSS-M Progressions (2023), 6–8 The Number System — division of rationals is defined from multiplication (7.NS.A.2.a → 7.NS.A.2.b). High confidence.</span>","6.NS.A.1|7.NS.A.2.b":"Fraction division underlies rational-number quotients.<span class=\"tipcite\">CCSS-M Progressions (2023), 6–8 The Number System — grade-6 fraction division (6.NS.A.1) is the basis extended to signed rational quotients. High confidence.</span>","8.SP.A.1|8.SP.A.4":"Bivariate association via scatter plots before two-way categorical tables.<span class=\"tipcite\">CCSS-M Progressions (2023), 6–8 Statistics & Probability — two-way tables (8.SP.A.4) sit within grade-8 bivariate association (8.SP.A.1). Moderate–high confidence.</span>","6.SP.B.4|8.SP.A.4":"Displaying data distributions is the earlier data-representation skill.<span class=\"tipcite\">CCSS-M Progressions (2023), 6–8 Statistics & Probability — grade-6 data displays (6.SP.B) as the earlier representation work. Moderate confidence.</span>","4.MD.B.4|5.DL.A.1":"Fraction line plots — reading/representing data displays.<span class=\"tipcite\">No CCSS progression (5.DL.A.1 is NJ Data Literacy). Nearest: CCSS-M K–5 Measurement & Data (line plots, 4.MD.B.4); finer grain: Hess Learning Progressions Frameworks (NC   function collect(sel, atRight){
    const arr=[];
    document.querySelectorAll(sel).forEach(ch=>{
      const r=ch.getBoundingClientRect(); const cy=r.top-stage.top+r.height/2;
      if(r.bottom<stage.top+6||r.top>stage.bottom-6) return;             // only visible cards

    return ap-bp||a.localeCompare(b,undefined,{numeric:true}); }).slice(0,40);
  res.innerHTML="";
  if(!matches.length){ res.innerHTML='<div class="rrow"><span class="rt">no match for “'+qraw+'”</span></div>'; res.classList.add("on"); return; }
  matches.forEach((c,i)=>{ const r=document.createElement("div"); r.className="rrow"+(i===sel?" sel":"");
    r.innerHTML='<span class="code">'+c+'</span><span class="rt">'+(title(c)||"")+'</span><span class="g">G'+grade(c)+'</span>';
    r.onmousedown=ev=>{ev.preventDefault(); jump(c);}; res.appendChild(r); });
  res.classList.add("on");
  if(sel>=0){ const s=res.querySelector(".sel"); if(s) s.scrollIntoView({block:"nearest"}); }
}
function closeResults(){ $("results").classList.remove("on"); sel=-1; }

$("q").addEventListener("input",e=>{ sel=-1; search(e.target.value); });
$("q").addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeResults(); $("q").blur(); return; }
  if(!matches.length) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(sel+1,matches.length-1); search($("q").value); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(sel-1,0); search($("q").value); }
  else if(e.key==="Enter"){ e.preventDefault(); jump(matches[Math.max(sel,0)]); }
});
document.addEventListener("click",e=>{ if(!e.target.closest(".searchwrap")) closeResults(); });

/* global keys */
document.addEventListener("keydown",e=>{
  const typing = document.activeElement===$("q");
  if((e.key==="/"||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k")) && !typing){ e.preventDefault(); $("q").focus(); $("q").select(); return; }
  if(typing) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); selectSide('pre'); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); selectSide('post'); }
  else if(e.key==="ArrowUp" && cursor.side){ e.preventDefault(); moveCursor(-1); }
  else if(e.key==="ArrowDown" && cursor.side){ e.preventDefault(); moveCursor(1); }
  else if(e.key==="Enter" && cursor.side){ e.preventDefault(); commitCursor(); }
  else if(e.key==="Escape" && cursor.side){ cursor={side:null,idx:0}; renderCursor(); }
});

$("auto").onclick=autoStrand;
$("copy").onclick=copyStrand;
$("clear").onclick=e=>{ strand=[focus]; render(); };
$("stepL").onclick=()=>selectSide('pre');
$("stepR").onclick=()=>selectSide('post');
function showTip(label, text, cls){ if(!text) return; const t=$("tip"); t.innerHTML='<b>'+label+'</b>'+text; t.dataset.kind=cls||"sug"; t.style.display="block"; requestAnimationFrame(()=>t.classList.add("on")); }
function moveTip(x,y){ const t=$("tip"); if(t.style.display!=="block") return; const w=t.offsetWidth,h=t.offsetHeight;
  let l=x+16, tp=y+16; if(l+w>innerWidth-8) l=x-16-w; if(tp+h>innerHeight-8) tp=y-16-h; t.style.left=l+"px"; t.style.top=tp+"px"; }
function hideTip(){ const t=$("tip"); t.classList.remove("on"); setTimeout(()=>{ if(!t.classList.contains("on")) t.style.display="none"; }, 150); }
let rt; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(drawWires,80); });
$("pre").addEventListener("scroll",()=>requestAnimationFrame(drawWires),{passive:true});
$("post").addEventListener("scroll",()=>requestAnimationFrame(drawWires),{passive:true});

/* ---------- whole-graph map view ---------- */
const L = DATA.layout, MPAD = 80;
let mapReady = false, vb = {x:0,y:0,w:0,h:0};
function edgeColor(f,t){ const k=f+"|"+t; return CURR.has(k)?"var(--curr)":SUG.has(k)?"var(--sug)":"var(--red)"; }
function renderMap(){
  const svg=$("mapsvg"); let e="",nd="",hdr="";
  for(const f in POST){ const a=L.pos[f]; if(!a) continue;
    for(const t of POST[f]){ const b=L.pos[t]; if(!b) continue;
      e+='<line x1="'+(a[0]+MPAD)+'" y1="'+(a[1]+MPAD)+'" x2="'+(b[0]+MPAD)+'" y2="'+(b[1]+MPAD)+'" stroke="'+edgeColor(f,t)+'" stroke-width="1" stroke-opacity=".22"/>'; } }
  for(let i=0;i<L.cols.length;i++) hdr+='<text class="maphdr" x="'+(i*L.colw+MPAD)+'" y="'+(MPAD-32)+'">Gr '+L.cols[i]+'</text>';
  for(const c in L.pos){ const p=L.pos[c], n=N[c];
    nd+='<g class="mnode" data-code="'+c+'" transform="translate('+(p[0]+MPAD)+','+(p[1]+MPAD)+')"><circle r="3.4" class="dot-'+n.b+'"/><text x="7" y="3.3">'+c+'</text></g>'; }
  svg.innerHTML='<g>'+e+'</g>'+hdr+'<g>'+nd+'</g>';
  mapReady=true; fitMap();
}
function applyVB(){ $("mapsvg").setAttribute("viewBox", vb.x+" "+vb.y+" "+vb.w+" "+vb.h); }
function fitMap(){ vb={x:-30, y:-50, w:L.w+MPAD*2+60, h:L.h+MPAD*2+70}; applyVB(); }
function svgXY(cx,cy){ const r=$("mapsvg").getBoundingClientRect(); return [vb.x+(cx-r.left)/r.width*vb.w, vb.y+(cy-r.top)/r.height*vb.h]; }
function zoomMap(f,cx,cy){ const [ux,uy]=svgXY(cx,cy), k=1/f, nw=vb.w*k;
  if(nw<60 || nw>(L.w+600)*2.2) return; vb.x=ux-(ux-vb.x)*k; vb.y=uy-(uy-vb.y)*k; vb.w=nw; vb.h*=k; applyVB(); }
(function(){ const svg=$("mapsvg");
  svg.addEventListener("wheel", ev=>{ ev.preventDefault(); zoomMap(ev.deltaY<0?1.18:1/1.18, ev.clientX, ev.clientY); }, {passive:false});
  let dr=null;
  svg.addEventListener("mousedown", ev=>{ dr={x:ev.clientX,y:ev.clientY,vx:vb.x,vy:vb.y,moved:false}; });
  addEventListener("mousemove", ev=>{ if(!dr) return; const r=svg.getBoundingClientRect();
    if(Math.abs(ev.clientX-dr.x)+Math.abs(ev.clientY-dr.y)>3) dr.moved=true;
    vb.x=dr.vx-(ev.clientX-dr.x)/r.width*vb.w; vb.y=dr.vy-(ev.clientY-dr.y)/r.height*vb.h; applyVB(); });
  addEventListener("mouseup", ev=>{ if(dr && !dr.moved){ const g=ev.target.closest && ev.target.closest(".mnode"); if(g){ jump(g.dataset.code); setView("explorer"); } } dr=null; });
  $("zoomin").onclick=()=>zoomMap(1.3, innerWidth/2, innerHeight/2);
  $("zoomout").onclick=()=>zoomMap(1/1.3, innerWidth/2, innerHeight/2);
  $("zoomfit").onclick=fitMap;
})();
function setView(v){ const m = v==="map";
  $("map").classList.toggle("hide", !m);
  document.querySelector(".stage").classList.toggle("hide", m);
  document.querySelectorAll('#viewseg button').forEach(b=>b.classList.toggle("on", b.dataset.view===v));
  if(m && !mapReady) renderMap();
}
document.querySelectorAll('#viewseg button').forEach(b => b.onclick = () => setView(b.dataset.view));

$("stat").innerHTML = '<b>'+DATA.meta.nodes+'</b> nodes &nbsp; <b>'+DATA.meta.edges+'</b> edges';
addEventListener("hashchange",()=>{ readURL(); render(); });   // pasted/edited links update live
readURL();
render();
setTimeout(drawWires,60);
</script>
</body>
